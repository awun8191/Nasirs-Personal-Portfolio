<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>RAG Data Pipeline - Determinism Mechanism</title>
  <desc>Determinism mechanism architecture: Three input invariants (chunk-level content hashing, temperature 0.0 greedy sampling, and strict JSON-schema templates) route through the deterministic processing engine to guarantee shard-identical chunk IDs, reproducible outputs, and edge cache hit stability.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#0891B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#0E7490" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#0891B2" letter-spacing="0.12em">DETERMINISM MECHANISM / INVARIANT ARCHITECTURE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">GUARANTEED REPRODUCIBILITY</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== TIER 1: INPUT INVARIANTS ==================== -->
  <!-- Invariant 1: Chunk Hashing -->
  <rect x="32" y="66" width="224" height="82" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="44" y="78" width="60" height="18" rx="3" fill="#E2E8F0"/>
  <text x="74" y="90" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">CONTROL 01</text>
  <text x="44" y="112" font-size="11" font-weight="600" fill="#0F172A">CHUNK-LEVEL HASH</text>
  <text x="44" y="128" font-size="8.5" fill="#64748B">SHA-256 Normalized Digest</text>
  <text x="44" y="140" font-size="8" fill="#0891B2">Shard-Invariant Content Key</text>

  <!-- Invariant 2: Temp 0.0 -->
  <rect x="288" y="66" width="224" height="82" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="300" y="78" width="60" height="18" rx="3" fill="#E2E8F0"/>
  <text x="330" y="90" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">CONTROL 02</text>
  <text x="300" y="112" font-size="11" font-weight="600" fill="#0F172A">TEMPERATURE 0.0</text>
  <text x="300" y="128" font-size="8.5" fill="#64748B">Locked Greedy Decoding</text>
  <text x="300" y="140" font-size="8" fill="#0891B2">Zero Stochastic Sampling</text>

  <!-- Invariant 3: Schema Constraints -->
  <rect x="544" y="66" width="224" height="82" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="556" y="78" width="60" height="18" rx="3" fill="#E2E8F0"/>
  <text x="586" y="90" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">CONTROL 03</text>
  <text x="556" y="112" font-size="11" font-weight="600" fill="#0F172A">STRICT JSON SCHEMA</text>
  <text x="556" y="128" font-size="8.5" fill="#64748B">Type-Safe Output Envelope</text>
  <text x="556" y="140" font-size="8" fill="#0891B2">Deterministic Syntax Tree</text>

  <!-- Orthogonal Connectors to Tier 2 -->
  <path d="M144 148 L144 175 Q144 185 154 185 L260 185 Q270 185 270 195 L270 200" fill="none" stroke="#0891B2" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>
  <path d="M400 148 L400 198" fill="none" stroke="#0891B2" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>
  <path d="M656 148 L656 175 Q656 185 646 185 L540 185 Q530 185 530 195 L530 200" fill="none" stroke="#0891B2" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== TIER 2: ENGINE CORE ==================== -->
  <rect x="180" y="200" width="440" height="76" rx="8" fill="#0E7490" stroke="#0891B2" stroke-width="1.5"/>
  <rect x="194" y="210" width="76" height="18" rx="3" fill="#164E63"/>
  <text x="232" y="222" font-size="8.5" font-weight="600" fill="#E0F2FE" text-anchor="middle">CORE ENGINE</text>
  <text x="194" y="244" font-size="13" font-weight="600" fill="#FFFFFF">DETERMINISTIC PIPELINE BUS</text>
  <text x="194" y="262" font-size="9" fill="#A5F3FC">Idempotent Execution · Identical Inputs Produce Byte-Identical Results</text>

  <!-- Orthogonal Connectors to Tier 3 -->
  <path d="M270 276 L270 286 Q270 296 260 296 L154 296 Q144 296 144 306 L144 322" fill="none" stroke="#0891B2" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>
  <path d="M400 276 L400 322" fill="none" stroke="#0891B2" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>
  <path d="M530 276 L530 286 Q530 296 540 296 L646 296 Q656 296 656 306 L656 322" fill="none" stroke="#0891B2" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== TIER 3: INVARIANT OUTPUTS ==================== -->
  <!-- Output 1: Shard IDs -->
  <rect x="32" y="324" width="224" height="82" rx="6" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.25"/>
  <rect x="44" y="336" width="60" height="18" rx="3" fill="#0891B2"/>
  <text x="74" y="348" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">INVARIANT 01</text>
  <text x="44" y="370" font-size="11" font-weight="600" fill="#0E7490">IDENTICAL CHUNK IDS</text>
  <text x="44" y="386" font-size="8.5" fill="#155E75">Uniform Across Multi-Shards</text>
  <text x="44" y="398" font-size="8" fill="#0891B2">Zero Redundant Embeddings</text>

  <!-- Output 2: Reproducible Answers -->
  <rect x="288" y="324" width="224" height="82" rx="6" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.25"/>
  <rect x="300" y="336" width="60" height="18" rx="3" fill="#0891B2"/>
  <text x="330" y="348" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">INVARIANT 02</text>
  <text x="300" y="370" font-size="11" font-weight="600" fill="#0E7490">REPRODUCIBLE ANSWER</text>
  <text x="300" y="386" font-size="8.5" fill="#155E75">Exact Structured Output</text>
  <text x="300" y="398" font-size="8" fill="#0891B2">Repeatable Citation Attribution</text>

  <!-- Output 3: Cache Stability -->
  <rect x="544" y="324" width="224" height="82" rx="6" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.25"/>
  <rect x="556" y="336" width="60" height="18" rx="3" fill="#0891B2"/>
  <text x="586" y="348" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">INVARIANT 03</text>
  <text x="556" y="370" font-size="11" font-weight="600" fill="#0E7490">STABLE CACHE KEYS</text>
  <text x="556" y="386" font-size="8.5" fill="#155E75">Deterministic Key Generation</text>
  <text x="556" y="398" font-size="8" fill="#0891B2">High Edge Cache Hit Rate</text>

  <!-- Footer -->
  <line x1="32" y1="422" x2="768" y2="422" stroke="#E2E8F0" stroke-width="1"/>
  <text x="32" y="438" font-size="8.5" fill="#64748B">CourseGen / Determinism Mechanism</text>
  <text x="768" y="438" font-size="8.5" fill="#64748B" text-anchor="end">Source: github.com/awun8191/CourseGen</text>
</svg>
