<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 449" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>RAG Data Pipeline - Determinism Mechanism</title>
  <desc>Determinism mechanism: chunk-level hashes produce identical chunk IDs across shards for the same source material, and generation is locked at temperature 0.0 with specialized seeding, so output is reproducible. No hash algorithm, seed value, shard count, or model settings are invented.</desc>
  <defs><marker id="chev" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 5 L1.5 8.5" fill="none" stroke="#155e75" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="798" height="449" fill="#FFFFFF"/>
  <!-- inputs row -->
  <rect x="34" y="40" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="144.0" y="65.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">CHUNK-LEVEL HASH</text><text x="144.0" y="81.0" font-size="11" fill="#5b7785" text-anchor="middle">PER SOURCE</text>
  <rect x="289" y="40" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="399.0" y="65.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">TEMPERATURE 0.0</text><text x="399.0" y="81.0" font-size="11" fill="#5b7785" text-anchor="middle">LOCKED</text>
  <rect x="544" y="40" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="654.0" y="65.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">SPECIALIZED SEEDING</text><text x="654.0" y="81.0" font-size="11" fill="#5b7785" text-anchor="middle">REPRODUCIBLE RUNS</text>
  <!-- merge -->
  <rect x="289" y="190" width="220" height="64" rx="8" fill="#0e7490" stroke="#0e7490" stroke-width="1.25"/><text x="399.0" y="215.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">DETERMINISTIC PIPELINE</text><text x="399.0" y="231.0" font-size="11" fill="#cbe9f2" text-anchor="middle">SAME INPUT -> SAME OUTPUT</text>
  <!-- outputs row -->
  <rect x="34" y="340" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="144.0" y="358.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">IDENTICAL CHUNK IDS</text><text x="144.0" y="374.0" font-size="11" fill="#5b7785" text-anchor="middle">ACROSS SHARDS</text>
  <rect x="289" y="340" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="399.0" y="358.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">REPRODUCIBLE OUTPUT</text><text x="399.0" y="374.0" font-size="11" fill="#5b7785" text-anchor="middle">GEMINI GENERATION</text>
  <rect x="544" y="340" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="654.0" y="365.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">STABLE CACHE KEYS</text>
  <!-- connectors -->
  <path d="M144 104 L399 186" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M399 104 L399 186" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M654 104 L399 186" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M399 254 L144 336" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M399 254 L399 336" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M399 254 L654 336" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="399" y="426" font-size="10" fill="#0e7490" text-anchor="middle">Chunk-level hashing makes the same source resolve to the same chunk IDs on every shard; temperature 0.0 plus seeding make generation reproducible.</text>
</svg>
