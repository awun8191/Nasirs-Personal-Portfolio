<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>AWUN - Infrastructure Cost Curve</title>
  <desc>Infrastructure cost curve: Verified monthly operating expenses from launch to 5,000 active vendors. Shows free-tier absorption across Cloud Run, Cloudflare D1, and R2, rejecting inflated enterprise estimates.</desc>
  <defs>
    <linearGradient id="cost-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B4513" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#8B4513" letter-spacing="0.12em">AWUN / 07 · INFRASTRUCTURE COST CURVE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#78716C" text-anchor="end">AUDITED UNIT ECONOMICS</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E7E5E4" stroke-width="1"/>

  <!-- ==================== PLOT AREA ==================== -->
  <!-- Y-Axis Gridlines & Labels -->
  <!-- $50 -->
  <line x1="80" y1="80" x2="740" y2="80" stroke="#F5EBE1" stroke-width="1"/>
  <text x="70" y="84" font-size="8.5" fill="#78716C" text-anchor="end">$50</text>

  <!-- $40 -->
  <line x1="80" y1="120" x2="740" y2="120" stroke="#F5EBE1" stroke-width="1"/>
  <text x="70" y="124" font-size="8.5" fill="#78716C" text-anchor="end">$40</text>

  <!-- $30 -->
  <line x1="80" y1="160" x2="740" y2="160" stroke="#F5EBE1" stroke-width="1"/>
  <text x="70" y="164" font-size="8.5" fill="#78716C" text-anchor="end">$30</text>

  <!-- $20 -->
  <line x1="80" y1="200" x2="740" y2="200" stroke="#F5EBE1" stroke-width="1"/>
  <text x="70" y="204" font-size="8.5" fill="#78716C" text-anchor="end">$20</text>

  <!-- $10 -->
  <line x1="80" y1="240" x2="740" y2="240" stroke="#F5EBE1" stroke-width="1"/>
  <text x="70" y="244" font-size="8.5" fill="#78716C" text-anchor="end">$10</text>

  <!-- $0 Baseline -->
  <line x1="80" y1="265" x2="740" y2="265" stroke="#1C1917" stroke-width="1.25"/>
  <text x="70" y="269" font-size="8.5" fill="#1C1917" font-weight="600" text-anchor="end">$0</text>

  <!-- Y-Axis Title -->
  <text x="40" y="68" font-size="8" font-weight="600" fill="#8B4513">MONTHLY OPEX ($)</text>

  <!-- Shaded Area Under Curve -->
  <path d="M140 260 Q 230 255 320 242 Q 500 215 680 125 L680 265 L140 265 Z" fill="url(#cost-gradient)"/>

  <!-- Cost Curve Line -->
  <path d="M140 260 Q 230 255 320 242 Q 500 215 680 125" fill="none" stroke="#8B4513" stroke-width="2.5"/>

  <!-- Data Point 1: Launch -->
  <circle cx="140" cy="260" r="5" fill="#FFFFFF" stroke="#8B4513" stroke-width="2"/>
  <rect x="100" y="222" width="80" height="24" rx="3" fill="#FDFBF7" stroke="#8B4513" stroke-width="1"/>
  <text x="140" y="238" font-size="9" font-weight="600" fill="#8B4513" text-anchor="middle">~$0-2/MO</text>
  <text x="140" y="282" font-size="9" font-weight="600" fill="#1C1917" text-anchor="middle">LAUNCH</text>
  <text x="140" y="294" font-size="7.5" fill="#78716C" text-anchor="middle">0 - 50 Vendors</text>

  <!-- Data Point 2: 500 Vendors -->
  <circle cx="320" cy="242" r="5" fill="#FFFFFF" stroke="#8B4513" stroke-width="2"/>
  <rect x="280" y="204" width="80" height="24" rx="3" fill="#FDFBF7" stroke="#8B4513" stroke-width="1"/>
  <text x="320" y="220" font-size="9" font-weight="600" fill="#8B4513" text-anchor="middle">~$7-9/MO</text>
  <text x="320" y="282" font-size="9" font-weight="600" fill="#1C1917" text-anchor="middle">500 VENDORS</text>
  <text x="320" y="294" font-size="7.5" fill="#78716C" text-anchor="middle">Light Overage</text>

  <!-- Data Point 3: 5,000 Vendors -->
  <circle cx="680" cy="125" r="5" fill="#FFFFFF" stroke="#8B4513" stroke-width="2"/>
  <rect x="635" y="87" width="90" height="24" rx="3" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.25"/>
  <text x="680" y="103" font-size="9.5" font-weight="600" fill="#8B4513" text-anchor="middle">~$39-41/MO</text>
  <text x="680" y="282" font-size="9" font-weight="600" fill="#1C1917" text-anchor="middle">5,000 VENDORS</text>
  <text x="680" y="294" font-size="7.5" fill="#78716C" text-anchor="middle">Scale Traffic</text>

  <!-- ==================== TIER 2: BREAKDOWN LEDGER ==================== -->
  <rect x="80" y="316" width="660" height="84" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1"/>
  
  <rect x="96" y="328" width="190" height="60" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="106" y="344" font-size="8.5" font-weight="600" fill="#8B4513">FREE TIER COVERAGE:</text>
  <text x="106" y="358" font-size="8" fill="#78716C">• Cloud Run 2M invocations</text>
  <text x="106" y="370" font-size="8" fill="#78716C">• Cloudflare D1 5M reads/day</text>
  <text x="106" y="382" font-size="8" fill="#78716C">• R2 10 GB free storage</text>

  <rect x="306" y="328" width="200" height="60" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="316" y="344" font-size="8.5" font-weight="600" fill="#8B4513">SCALE EXPENSE DRIVERS:</text>
  <text x="316" y="358" font-size="8" fill="#78716C">• R2 Class A write operations</text>
  <text x="316" y="370" font-size="8" fill="#78716C">• D1 database storage growth</text>
  <text x="316" y="382" font-size="8" fill="#78716C">• Vectorize query volume</text>

  <rect x="526" y="328" width="200" height="60" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="536" y="344" font-size="8.5" font-weight="600" fill="#065F46">AUDIT VERIFICATION:</text>
  <text x="536" y="358" font-size="8" fill="#15803D">• $370-1,150 quote rejected</text>
  <text x="536" y="370" font-size="8" fill="#15803D">• Zero fixed monthly servers</text>
  <text x="536" y="382" font-size="8" fill="#15803D">• Pure pay-per-request model</text>

  <!-- Footer -->
  <line x1="32" y1="418" x2="768" y2="418" stroke="#E7E5E4" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#78716C">AWUN / 07 OF 08 · Cost Curve</text>
  <text x="768" y="434" font-size="8.5" fill="#78716C" text-anchor="end">Source: docs/audit/cost-model-recheck.md</text>
</svg>
