<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 343" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Vigil - Run state machine</title>
  <desc>Five run states: queued, running, awaiting approval, awaiting background job, and completed. Two exception states, failed and stale thread paused. Every state is a database row, so a paused run does not hold a process.</desc>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="343" fill="#FFFFFF"/>

  <text x="32" y="32" font-size="10" font-weight="600" fill="#334155" letter-spacing="0.12em">VIGIL / 02 · RUN STATE MACHINE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#1E293B" text-anchor="end">STATE IS A ROW</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Main path -->
  <rect x="32" y="96" width="128" height="64" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.25"/>
  <text x="96" y="122" font-size="10" font-weight="600" fill="#0F172A" text-anchor="middle">QUEUED</text>
  <text x="96" y="138" font-size="7.5" fill="#475569" text-anchor="middle">job in the table</text>

  <rect x="184" y="96" width="128" height="64" rx="4" fill="#F1F5F9" stroke="#334155" stroke-width="1.25"/>
  <text x="248" y="122" font-size="10" font-weight="600" fill="#0F172A" text-anchor="middle">RUNNING</text>
  <text x="248" y="138" font-size="7.5" fill="#475569" text-anchor="middle">six-stage loop</text>

  <rect x="336" y="96" width="128" height="64" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="400" y="116" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">HUMAN</text>
  <text x="400" y="132" font-size="10" font-weight="600" fill="#0F172A" text-anchor="middle">AWAITING</text>
  <text x="400" y="146" font-size="10" font-weight="600" fill="#0F172A" text-anchor="middle">APPROVAL</text>

  <rect x="488" y="96" width="128" height="64" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.25"/>
  <text x="552" y="116" font-size="10" font-weight="600" fill="#0F172A" text-anchor="middle">AWAITING</text>
  <text x="552" y="130" font-size="10" font-weight="600" fill="#0F172A" text-anchor="middle">JOB</text>
  <text x="552" y="146" font-size="7.5" fill="#475569" text-anchor="middle">worker has no run</text>

  <rect x="640" y="96" width="128" height="64" rx="4" fill="#1E293B" stroke="#1E293B" stroke-width="1.25"/>
  <text x="704" y="126" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">COMPLETED</text>
  <text x="704" y="142" font-size="7.5" fill="#CBD5E1" text-anchor="middle">evidence persisted</text>

  <!-- Arrows and labels -->
  <line x1="160" y1="128" x2="180" y2="128" stroke="#334155" stroke-width="1.25" marker-end="url(#arrow2)"/>
  <text x="170" y="86" font-size="7" fill="#64748B" text-anchor="middle">claim</text>

  <line x1="312" y1="128" x2="332" y2="128" stroke="#334155" stroke-width="1.25" marker-end="url(#arrow2)"/>
  <text x="322" y="86" font-size="7" fill="#64748B" text-anchor="middle">gate</text>

  <line x1="464" y1="128" x2="484" y2="128" stroke="#334155" stroke-width="1.25" marker-end="url(#arrow2)"/>
  <text x="474" y="86" font-size="7" fill="#64748B" text-anchor="middle">job</text>

  <line x1="616" y1="128" x2="636" y2="128" stroke="#334155" stroke-width="1.25" marker-end="url(#arrow2)"/>
  <text x="626" y="86" font-size="7" fill="#64748B" text-anchor="middle">finish</text>

  <!-- Exception states panel -->
  <rect x="32" y="196" width="736" height="94" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="46" y="216" font-size="8" font-weight="600" fill="#334155">TWO EXCEPTION STATES</text>
  <line x1="46" y1="224" x2="754" y2="224" stroke="#E2E8F0" stroke-width="0.75"/>

  <text x="46" y="244" font-size="9" font-weight="600" fill="#0F172A">FAILED</text>
  <text x="46" y="259" font-size="7.5" fill="#475569">a step returns an error after the retry budget</text>
  <text x="46" y="272" font-size="7.5" fill="#64748B">the run keeps its steps and its artifact list</text>

  <line x1="400" y1="232" x2="400" y2="278" stroke="#E2E8F0" stroke-width="0.75"/>

  <text x="416" y="244" font-size="9" font-weight="600" fill="#0F172A">STALE THREAD PAUSED</text>
  <text x="416" y="259" font-size="7.5" fill="#475569">the context is too long for the reasoning model</text>
  <text x="416" y="272" font-size="7.5" fill="#64748B">compaction runs before the next turn resumes</text>

  <text x="32" y="318" font-size="8" fill="#64748B">A pause is a row, not a process. The worker exits at every gate, and a later worker resumes the run.</text>
</svg>
