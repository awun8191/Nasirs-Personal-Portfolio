<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>TRAKS - Semantic Search</title>
  <desc>Semantic search: verified incident text and metadata are embedded and stored in Cloudflare Vectorize; a meaning-based query is matched by cosine similarity over the index and returns results in under 500ms.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="30" y="90" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="110" y="118" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">VERIFIED</text>
  <text x="110" y="136" font-size="11" fill="#991B1B" text-anchor="middle">INCIDENTS</text>
  <rect x="30" y="200" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="110" y="228" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">EMBEDDINGS</text>
  <text x="110" y="246" font-size="10" fill="#991B1B" text-anchor="middle">VECTORIZE</text>
  <rect x="250" y="140" width="170" height="110" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.25"/>
  <text x="335" y="180" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">CLOUDFLARE</text>
  <text x="335" y="200" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">VECTORIZE</text>
  <text x="335" y="220" font-size="10" fill="#FECACA" text-anchor="middle">SEMANTIC INDEX</text>
  <rect x="610" y="90" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="690" y="118" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">QUERY</text>
  <text x="690" y="136" font-size="11" fill="#991B1B" text-anchor="middle">MEANING-BASED</text>
  <rect x="610" y="200" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="690" y="220" font-size="12" fill="#2A1418" text-anchor="middle" font-weight="600">COSINE</text>
  <text x="690" y="238" font-size="12" fill="#2A1418" text-anchor="middle" font-weight="600">SIMILARITY</text>
  <rect x="610" y="320" width="160" height="60" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.25"/>
  <text x="690" y="348" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">RESULTS</text>
  <text x="690" y="366" font-size="11" fill="#FECACA" text-anchor="middle">&lt; 500 ms</text>
  <path d="M110 150 L110 200" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M190 230 L250 230" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M610 120 L520 120 L520 195 L420 195" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M420 225 L520 225 L520 230 L610 230" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M690 150 L690 200" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M690 260 L690 320" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="400" y="415" font-size="10" fill="#991B1B" text-anchor="middle">Verified incident text is embedded and stored in Vectorize; meaning-based queries match by cosine similarity and return in under 500ms (confirmed).</text>
</svg>
