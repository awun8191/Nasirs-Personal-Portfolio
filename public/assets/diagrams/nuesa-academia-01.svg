<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>NUESA Academia - System Architecture</title>
  <desc>System Architecture: React SPA connects to public FastAPI boundary, forwarding requests via signed HMAC-SHA256 to a private TypeScript Data Worker that manages Cloudflare D1 SQL and Cloudflare R2 storage, verified by Firebase Auth.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#047857" letter-spacing="0.12em">NUESA ACADEMIA / 01 · SYSTEM ARCHITECTURE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#065F46" text-anchor="end">EDGE ARCHITECTURE &amp; DATA SERVICE</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== COLUMN 1: PRESENTATION TIER ==================== -->
  <rect x="32" y="60" width="216" height="344" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1.25"/>
  <rect x="44" y="72" width="80" height="18" rx="3" fill="#DCFCE7"/>
  <text x="84" y="84" font-size="8" font-weight="600" fill="#065F46" text-anchor="middle">CLIENT TIER</text>
  <text x="44" y="112" font-size="12" font-weight="600" fill="#064E3B">REACT 19 SPA</text>
  <text x="44" y="128" font-size="8.5" fill="#065F46">Faculty Repository Portal</text>
  <line x1="44" y1="138" x2="236" y2="138" stroke="#BBF7D0" stroke-width="0.75"/>

  <text x="44" y="158" font-size="8.5" font-weight="600" fill="#064E3B">4 CORE SURFACES:</text>
  <text x="44" y="174" font-size="8" fill="#065F46">• Full Syllabus Search</text>
  <text x="44" y="188" font-size="8" fill="#065F46">• Past Questions Mode (PQ)</text>
  <text x="44" y="202" font-size="8" fill="#065F46">• Direct Edge PDF Upload</text>
  <text x="44" y="216" font-size="8" fill="#065F46">• Faculty Coverage Analytics</text>

  <rect x="44" y="238" width="192" height="70" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="54" y="256" font-size="8.5" font-weight="600" fill="#047857">CLIENT AUTHENTICATION:</text>
  <text x="54" y="272" font-size="8" fill="#064E3B">Firebase Auth ID Tokens</text>
  <text x="54" y="286" font-size="8" fill="#065F46">Transmitted via Bearer headers</text>
  <text x="54" y="298" font-size="7.5" fill="#059669">Strict Session Invalidation</text>

  <rect x="44" y="322" width="192" height="66" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="54" y="340" font-size="8.5" font-weight="600" fill="#047857">LOCAL CLIENT STATE:</text>
  <text x="54" y="356" font-size="8" fill="#064E3B">TanStack React Query</text>
  <text x="54" y="370" font-size="7.5" fill="#065F46">Optimistic UI + Cache Invalidate</text>

  <!-- ==================== COLUMN 2: PUBLIC GATEWAY ==================== -->
  <rect x="290" y="60" width="226" height="344" rx="6" fill="#047857" stroke="#064E3B" stroke-width="1.5"/>
  <rect x="302" y="72" width="110" height="18" rx="3" fill="#064E3B"/>
  <text x="357" y="84" font-size="8" font-weight="600" fill="#A7F3D0" text-anchor="middle">API BOUNDARY</text>
  <text x="302" y="112" font-size="12" font-weight="600" fill="#FFFFFF">FASTAPI GATEWAY</text>
  <text x="302" y="128" font-size="8.5" fill="#A7F3D0">Dual Runtime: Container / Worker</text>
  <line x1="302" y1="138" x2="504" y2="138" stroke="#059669" stroke-width="0.75"/>

  <text x="302" y="158" font-size="8.5" font-weight="600" fill="#FFFFFF">GATEWAY RESPONSIBILITIES:</text>
  <text x="302" y="174" font-size="8" fill="#E2E8F0">• Firebase Token Verification</text>
  <text x="302" y="188" font-size="8" fill="#E2E8F0">• Search Query Sanitation</text>
  <text x="302" y="202" font-size="8" fill="#E2E8F0">• Keyset Pagination Encoding</text>
  <text x="302" y="216" font-size="8" fill="#E2E8F0">• HMAC-SHA256 Internal Signer</text>

  <rect x="302" y="238" width="202" height="70" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
  <text x="312" y="256" font-size="8.5" font-weight="600" fill="#A7F3D0">SECURITY ENVELOPE:</text>
  <text x="312" y="272" font-size="8" fill="#FFFFFF">X-NUESA-Signature header</text>
  <text x="312" y="286" font-size="8" fill="#E2E8F0">Timestamp replay window (30s)</text>
  <text x="312" y="298" font-size="7.5" fill="#A7F3D0">Zero direct external SQL</text>

  <rect x="302" y="322" width="202" height="66" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
  <text x="312" y="340" font-size="8.5" font-weight="600" fill="#A7F3D0">UPLOAD DISPATCH:</text>
  <text x="312" y="356" font-size="8" fill="#FFFFFF">Multipart Stream Router</text>
  <text x="312" y="370" font-size="7.5" fill="#E2E8F0">≤ 25 MiB direct edge stream</text>

  <!-- Connectors C1 -> C2 -->
  <path d="M248 160 L290 160" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="269" y="152" font-size="7.5" font-weight="600" fill="#047857" text-anchor="middle">HTTPS</text>

  <!-- ==================== COLUMN 3: DATA SERVICE & PERSISTENCE ==================== -->
  <!-- Top Box: TypeScript Data Worker -->
  <rect x="558" y="60" width="210" height="106" rx="6" fill="#047857" stroke="#064E3B" stroke-width="1.25"/>
  <rect x="570" y="70" width="100" height="18" rx="3" fill="#064E3B"/>
  <text x="620" y="82" font-size="8" font-weight="600" fill="#A7F3D0" text-anchor="middle">EDGE WORKER</text>
  <text x="570" y="104" font-size="11" font-weight="600" fill="#FFFFFF">TYPESCRIPT DATA WORKER</text>
  <text x="570" y="118" font-size="8" fill="#A7F3D0">Private Cloudflare Edge Service</text>
  <line x1="570" y1="126" x2="756" y2="126" stroke="#059669" stroke-width="0.75"/>
  <text x="570" y="140" font-size="7.5" fill="#E2E8F0">Validates HMAC · Owns D1 &amp; R2</text>
  <text x="570" y="152" font-size="7.5" fill="#A7F3D0">Zero public database credentials</text>

  <!-- Connectors C2 -> C3 -->
  <path d="M516 113 L558 113" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="537" y="105" font-size="7" font-weight="600" fill="#047857" text-anchor="middle">HMAC RPC</text>

  <!-- Bottom Box 1: Cloudflare D1 -->
  <rect x="558" y="180" width="210" height="106" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1.25"/>
  <rect x="570" y="190" width="70" height="18" rx="3" fill="#DCFCE7"/>
  <text x="605" y="202" font-size="8" font-weight="600" fill="#065F46" text-anchor="middle">STORAGE</text>
  <text x="570" y="224" font-size="11" font-weight="600" fill="#064E3B">CLOUDFLARE D1</text>
  <text x="570" y="238" font-size="8" fill="#065F46">Relational SQLite Database</text>
  <line x1="570" y1="246" x2="756" y2="246" stroke="#BBF7D0" stroke-width="0.75"/>
  <text x="570" y="260" font-size="8" fill="#064E3B">• 9 Depts · 426 Courses</text>
  <text x="570" y="274" font-size="8" fill="#064E3B">• Keyset index: createdAt | id</text>

  <!-- Bottom Box 2: Cloudflare R2 -->
  <rect x="558" y="298" width="210" height="106" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1.25"/>
  <rect x="570" y="308" width="70" height="18" rx="3" fill="#DCFCE7"/>
  <text x="605" y="320" font-size="8" font-weight="600" fill="#065F46" text-anchor="middle">STORAGE</text>
  <text x="570" y="342" font-size="11" font-weight="600" fill="#064E3B">CLOUDFLARE R2</text>
  <text x="570" y="356" font-size="8" fill="#065F46">Immutable Object Storage</text>
  <line x1="570" y1="364" x2="756" y2="364" stroke="#BBF7D0" stroke-width="0.75"/>
  <text x="570" y="378" font-size="8" fill="#064E3B">• 2,111 PDF Blobs (~13.8 GB)</text>
  <text x="570" y="392" font-size="8" fill="#064E3B">• SHA-256 Dedup · Zero Egress</text>

  <!-- Connectors Worker -> D1 & R2 -->
  <path d="M663 166 L663 178" fill="none" stroke="#047857" stroke-width="1.25" marker-end="url(#arrow-green)"/>
  <path d="M663 286 L663 296" fill="none" stroke="#047857" stroke-width="1.25" marker-end="url(#arrow-green)"/>

  <!-- Footer -->
  <line x1="32" y1="418" x2="768" y2="418" stroke="#E2E8F0" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#065F46">NUESA ACADEMIA / 01 OF 07 · System Architecture</text>
  <text x="768" y="434" font-size="8.5" fill="#065F46" text-anchor="end">Source: docs/case-studies/nuesa-academia.md</text>
</svg>
