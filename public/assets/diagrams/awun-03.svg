<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>AWUN - Marketplace Flow</title>
  <desc>Marketplace flow: Link-first checkout lifecycle from vendor catalog selection to atomic stock reservation, buyer checkout, Paystack webhook verification, order creation, and subaccount payout, with explicit checkout link statuses.</desc>
  <defs>
    <marker id="arrow-terracotta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="360" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#8B4513" letter-spacing="0.12em">AWUN / 03 · LINK-FIRST MARKETPLACE FLOW</text>
  <text x="808" y="32" font-size="9" font-weight="500" fill="#78716C" text-anchor="end">ORDER ORCHESTRATION</text>
  <line x1="32" y1="44" x2="808" y2="44" stroke="#E7E5E4" stroke-width="1"/>

  <!-- ==================== TIER 1: ORDER FLOW ==================== -->
  <!-- Step 1 -->
  <rect x="32" y="64" width="138" height="126" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <rect x="42" y="74" width="46" height="18" rx="3" fill="#F5EBE1"/>
  <text x="65" y="86" font-size="8" font-weight="600" fill="#8B4513" text-anchor="middle">STEP 01</text>
  <text x="42" y="108" font-size="11" font-weight="600" fill="#1C1917">VENDOR</text>
  <text x="42" y="122" font-size="11" font-weight="600" fill="#1C1917">SELECTION</text>
  <line x1="42" y1="132" x2="160" y2="132" stroke="#E7E5E4" stroke-width="0.75"/>
  <text x="42" y="148" font-size="8" fill="#78716C">Picks variants</text>
  <text x="42" y="162" font-size="8" fill="#78716C">Configures price</text>
  <text x="42" y="176" font-size="7.5" fill="#8B4513">Direct or Catalog</text>

  <!-- Step 2 -->
  <rect x="194" y="64" width="138" height="126" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <rect x="204" y="74" width="46" height="18" rx="3" fill="#F5EBE1"/>
  <text x="227" y="86" font-size="8" font-weight="600" fill="#8B4513" text-anchor="middle">STEP 02</text>
  <text x="204" y="108" font-size="11" font-weight="600" fill="#1C1917">LINK &amp; STOCK</text>
  <text x="204" y="122" font-size="11" font-weight="600" fill="#1C1917">RESERVATION</text>
  <line x1="204" y1="132" x2="322" y2="132" stroke="#E7E5E4" stroke-width="0.75"/>
  <text x="204" y="148" font-size="8" fill="#78716C">Generates URL</text>
  <text x="204" y="162" font-size="8" fill="#78716C">30-Min Hold Window</text>
  <text x="204" y="176" font-size="7.5" fill="#8B4513">Atomic SQL reserve</text>

  <!-- Step 3 -->
  <rect x="356" y="64" width="138" height="126" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <rect x="366" y="74" width="46" height="18" rx="3" fill="#F5EBE1"/>
  <text x="389" y="86" font-size="8" font-weight="600" fill="#8B4513" text-anchor="middle">STEP 03</text>
  <text x="366" y="108" font-size="11" font-weight="600" fill="#1C1917">WHATSAPP &amp;</text>
  <text x="366" y="122" font-size="11" font-weight="600" fill="#1C1917">BUYER PAYS</text>
  <line x1="366" y1="132" x2="484" y2="132" stroke="#E7E5E4" stroke-width="0.75"/>
  <text x="366" y="148" font-size="8" fill="#78716C">Shared to buyer</text>
  <text x="366" y="162" font-size="8" fill="#78716C">Paystack Checkout</text>
  <text x="366" y="176" font-size="7.5" fill="#8B4513">Cards / Bank / USSD</text>

  <!-- Step 4 -->
  <rect x="518" y="64" width="138" height="126" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <rect x="528" y="74" width="46" height="18" rx="3" fill="#F5EBE1"/>
  <text x="551" y="86" font-size="8" font-weight="600" fill="#8B4513" text-anchor="middle">STEP 04</text>
  <text x="528" y="108" font-size="11" font-weight="600" fill="#1C1917">WEBHOOK</text>
  <text x="528" y="122" font-size="11" font-weight="600" fill="#1C1917">VERIFICATION</text>
  <line x1="528" y1="132" x2="646" y2="132" stroke="#E7E5E4" stroke-width="0.75"/>
  <text x="528" y="148" font-size="8" fill="#78716C">HMAC-SHA512 Check</text>
  <text x="528" y="162" font-size="8" fill="#78716C">Unique Event Lock</text>
  <text x="528" y="176" font-size="7.5" fill="#8B4513">Idempotent Commit</text>

  <!-- Step 5 -->
  <rect x="680" y="64" width="128" height="126" rx="6" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.5"/>
  <rect x="690" y="74" width="46" height="18" rx="3" fill="#8B4513"/>
  <text x="713" y="86" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">FINAL</text>
  <text x="690" y="108" font-size="11" font-weight="600" fill="#1C1917">ORDER &amp;</text>
  <text x="690" y="122" font-size="11" font-weight="600" fill="#1C1917">PAYOUT</text>
  <line x1="690" y1="132" x2="798" y2="132" stroke="#D7CCC8" stroke-width="0.75"/>
  <text x="690" y="148" font-size="8" fill="#78716C">Order snapshot</text>
  <text x="690" y="162" font-size="8" fill="#78716C">Resend receipts</text>
  <text x="690" y="176" font-size="7.5" fill="#8B4513">T+1 split payout</text>

  <!-- Connectors -->
  <path d="M170 127 L194 127" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <path d="M332 127 L356 127" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <path d="M494 127 L518 127" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <path d="M656 127 L680 127" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>

  <!-- ==================== TIER 2: CHECKOUT LINK STATUSES ==================== -->
  <rect x="32" y="210" width="776" height="88" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <text x="46" y="230" font-size="9" font-weight="600" fill="#8B4513">CHECKOUT LINK STATE LIFECYCLE (30-MINUTE RESERVATION WINDOW)</text>
  <line x1="46" y1="238" x2="794" y2="238" stroke="#E7E5E4" stroke-width="0.75"/>

  <!-- Status 1: OPEN -->
  <rect x="46" y="248" width="170" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="56" y="264" font-size="9" font-weight="600" fill="#1C1917">STATUS: OPEN</text>
  <text x="56" y="278" font-size="7.5" fill="#78716C">Stock held; awaiting payment</text>

  <!-- Status 2: PAID -->
  <rect x="234" y="248" width="170" height="38" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="244" y="264" font-size="9" font-weight="600" fill="#065F46">STATUS: PAID</text>
  <text x="244" y="278" font-size="7.5" fill="#15803D">Reservation consumed; order created</text>

  <!-- Status 3: EXPIRED -->
  <rect x="422" y="248" width="170" height="38" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="432" y="264" font-size="9" font-weight="600" fill="#92400E">STATUS: EXPIRED</text>
  <text x="432" y="278" font-size="7.5" fill="#B45309">Window elapsed; stock released</text>

  <!-- Status 4: CANCELLED -->
  <rect x="610" y="248" width="184" height="38" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="620" y="264" font-size="9" font-weight="600" fill="#991B1B">STATUS: CANCELLED</text>
  <text x="620" y="278" font-size="7.5" fill="#B91C1C">Merchant voided; stock released</text>

  <!-- Footer -->
  <line x1="32" y1="320" x2="808" y2="320" stroke="#E7E5E4" stroke-width="1"/>
  <text x="32" y="338" font-size="8.5" fill="#78716C">AWUN / 03 OF 08 · Marketplace Flow</text>
  <text x="808" y="338" font-size="8.5" fill="#78716C" text-anchor="end">Source: docs/case-studies/awun.md section 3 step 2</text>
</svg>
