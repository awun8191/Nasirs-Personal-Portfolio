<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Soiling Detection - State Machine</title>
  <desc>Six-state firmware finite state machine: SLEEP to SENSE to TRIGGER to INFER to CLEAN to RETURN and back to SLEEP. In SLEEP the Pi Zero 2 W is powered off and the sensor rail is MOSFET-gated to zero current; the CUSUM statistic persists in RP2040 RTC backup registers. TRIGGER fires when the one-sided CUSUM crosses its threshold; INFER wakes the Pi Zero to run XGBoost; CLEAN drives the carriage; RETURN homes it.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="480" height="480" fill="#FFFFFF"/>
  <!-- SLEEP -->
  <rect x="34" y="70" width="130" height="140" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="99.0" y="112.0" font-size="13" fill="#1C1917" text-anchor="middle" font-weight="600">SLEEP</text>
  <text x="99.0" y="136.0" font-size="10" fill="#78716C" text-anchor="middle">Pi Zero off</text>
  <text x="99.0" y="152.0" font-size="10" fill="#78716C" text-anchor="middle">rail gated</text>
  <!-- SENSE -->
  <rect x="186" y="70" width="130" height="140" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="251.0" y="112.0" font-size="13" fill="#1C1917" text-anchor="middle" font-weight="600">SENSE</text>
  <text x="251.0" y="136.0" font-size="10" fill="#78716C" text-anchor="middle">sensors poll</text>
  <text x="251.0" y="152.0" font-size="10" fill="#78716C" text-anchor="middle">~2 s cycle</text>
  <!-- TRIGGER -->
  <rect x="338" y="70" width="130" height="140" rx="8" fill="#92400E" stroke="#92400E" stroke-width="1.25"/>
  <text x="403.0" y="112.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">TRIGGER</text>
  <text x="403.0" y="136.0" font-size="10" fill="#FDE68A" text-anchor="middle">CUSUM alarm</text>
  <text x="403.0" y="152.0" font-size="10" fill="#FDE68A" text-anchor="middle">S &lt; H</text>
  <!-- RETURN -->
  <rect x="34" y="250" width="130" height="140" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="99.0" y="292.0" font-size="13" fill="#1C1917" text-anchor="middle" font-weight="600">RETURN</text>
  <text x="99.0" y="316.0" font-size="10" fill="#78716C" text-anchor="middle">home +</text>
  <text x="99.0" y="332.0" font-size="10" fill="#78716C" text-anchor="middle">sleep</text>
  <!-- INFER -->
  <rect x="186" y="250" width="130" height="140" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="251.0" y="292.0" font-size="13" fill="#1C1917" text-anchor="middle" font-weight="600">INFER</text>
  <text x="251.0" y="316.0" font-size="10" fill="#78716C" text-anchor="middle">Pi Zero wakes</text>
  <text x="251.0" y="332.0" font-size="10" fill="#78716C" text-anchor="middle">XGBoost</text>
  <!-- CLEAN -->
  <rect x="338" y="250" width="130" height="140" rx="8" fill="#92400E" stroke="#92400E" stroke-width="1.25"/>
  <text x="403.0" y="292.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">CLEAN</text>
  <text x="403.0" y="316.0" font-size="10" fill="#FDE68A" text-anchor="middle">NEMA17 +</text>
  <text x="403.0" y="332.0" font-size="10" fill="#FDE68A" text-anchor="middle">brush</text>
  <!-- connectors -->
  <path d="M164 140 L186 140" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M316 140 L338 140" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M403 210 C403 235, 251 225, 251 250" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M316 320 L338 320" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M468 320 L468 440 Q468 450 458 450 L116 450 Q108 450 108 440 L108 390" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M99 250 L99 210" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="240" y="468" font-size="9" fill="#78716C" text-anchor="middle">Six-state FSM. Pi Zero powers off and the sensor rail is MOSFET-gated in SLEEP; CUSUM state persists in RTC backup registers.</text>
</svg>
