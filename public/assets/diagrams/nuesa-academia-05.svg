<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>NUESA Academia - Search Flow</title>
  <desc>Deterministic search flow: React SPA builds filter parameters and past-question toggle, proxies through FastAPI gateway with Firebase authentication, dispatches HMAC-signed request to Cloudflare Data Worker, executes O(1) keyset pagination on D1 SQLite, and returns at most 50 items with base64 cursor for infinite scroll.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#047857" letter-spacing="0.12em">NUESA · 05 / SEARCH FLOW</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">KEYSET PAGINATION · ZERO-COUNT O(1) SCAN</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ROW 1 (REQUEST PATH: LEFT TO RIGHT) -->
  <!-- NODE 1: REACT SPA -->
  <rect x="32" y="64" width="220" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="44" y="74" width="68" height="18" rx="3" fill="#E2E8F0"/>
  <text x="78" y="87" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">CLIENT TIER</text>
  <text x="44" y="110" font-size="11.5" font-weight="600" fill="#0F172A">REACT SPA CLIENT</text>
  <line x1="44" y1="118" x2="240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="134" font-size="8" fill="#475569">• Params: q, level, dept, semester</text>
  <text x="44" y="148" font-size="8" fill="#475569">• PQ Toggle: course_code = 'PQ'</text>
  <text x="44" y="162" font-size="8" fill="#475569">• Keyset Cursor In-Memory State</text>
  <rect x="44" y="172" width="196" height="22" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="0.75"/>
  <text x="52" y="187" font-size="7.5" font-weight="600" fill="#047857">INPUT: /api/search?q=...&amp;level=300</text>

  <!-- NODE 2: FASTAPI GATEWAY -->
  <rect x="290" y="64" width="220" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="302" y="74" width="76" height="18" rx="3" fill="#E2E8F0"/>
  <text x="340" y="87" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">GATEWAY TIER</text>
  <text x="302" y="110" font-size="11.5" font-weight="600" fill="#0F172A">FASTAPI PROXY</text>
  <line x1="302" y1="118" x2="498" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  <text x="302" y="134" font-size="8" fill="#475569">• Route: /api/search</text>
  <text x="302" y="148" font-size="8" fill="#475569">• Firebase Bearer Verify</text>
  <text x="302" y="162" font-size="8" fill="#475569">• Rate Limiting &amp; Param Sanitize</text>
  <rect x="302" y="172" width="196" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.75"/>
  <text x="310" y="187" font-size="7.5" font-weight="600" fill="#047857">HMAC SIGN: /internal/search</text>

  <!-- NODE 3: CLOUDFLARE DATA WORKER -->
  <rect x="548" y="64" width="220" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="560" y="74" width="76" height="18" rx="3" fill="#E2E8F0"/>
  <text x="598" y="87" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">EDGE COMPUTE</text>
  <text x="560" y="110" font-size="11.5" font-weight="600" fill="#0F172A">DATA WORKER</text>
  <line x1="560" y1="118" x2="756" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  <text x="560" y="134" font-size="8" fill="#475569">• search() Handler Function</text>
  <text x="560" y="148" font-size="8" fill="#475569">• Verify Cloudflare HMAC Header</text>
  <text x="560" y="162" font-size="8" fill="#475569">• Filter: status = 'published'</text>
  <rect x="560" y="172" width="196" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.75"/>
  <text x="568" y="187" font-size="7.5" font-weight="600" fill="#047857">LIKE: Title, Code, Dept</text>

  <!-- Horizontal Connectors Row 1 -->
  <line x1="252" y1="134" x2="290" y2="134" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="510" y1="134" x2="548" y2="134" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Vertical Connector: Node 3 to Node 4 -->
  <line x1="658" y1="204" x2="658" y2="236" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ROW 2 (RESPONSE PATH: RIGHT TO LEFT) -->
  <!-- NODE 4: D1 SQLITE ENGINE -->
  <rect x="548" y="236" width="220" height="140" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="560" y="246" width="76" height="18" rx="3" fill="#047857"/>
  <text x="598" y="259" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">PERSISTENCE</text>
  <text x="560" y="282" font-size="11.5" font-weight="600" fill="#064E3B">D1 SQLITE ENGINE</text>
  <line x1="560" y1="290" x2="756" y2="290" stroke="#A7F3D0" stroke-width="1"/>
  <text x="560" y="306" font-size="8" fill="#065F46">• Courses + Documents Join</text>
  <text x="560" y="320" font-size="8" fill="#065F46">• Keyset: (createdAt, id) &lt; (?1, ?2)</text>
  <text x="560" y="334" font-size="8" fill="#065F46">• ORDER BY createdAt DESC LIMIT 50</text>
  <rect x="560" y="344" width="196" height="22" rx="3" fill="#FFFFFF" stroke="#047857" stroke-width="0.75"/>
  <text x="568" y="359" font-size="7.5" font-weight="600" fill="#047857">INDEX: (createdAt, id) Composite</text>

  <!-- NODE 5: RESPONSE SERIALIZATION -->
  <rect x="290" y="236" width="220" height="140" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="302" y="246" width="86" height="18" rx="3" fill="#047857"/>
  <text x="345" y="259" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">SERIALIZATION</text>
  <text x="302" y="282" font-size="11.5" font-weight="600" fill="#064E3B">RESPONSE STREAM</text>
  <line x1="302" y1="290" x2="498" y2="290" stroke="#A7F3D0" stroke-width="1"/>
  <text x="302" y="306" font-size="8" fill="#065F46">• Page Size: ≤ 50 Documents</text>
  <text x="302" y="320" font-size="8" fill="#065F46">• Next Cursor: Base64(createdAt|id)</text>
  <text x="302" y="334" font-size="8" fill="#065F46">• total: 0 (No COUNT(*) Overhead)</text>
  <rect x="302" y="344" width="196" height="22" rx="3" fill="#FFFFFF" stroke="#047857" stroke-width="0.75"/>
  <text x="310" y="359" font-size="7.5" font-weight="600" fill="#047857">JSON: { items, next_cursor, hasMore }</text>

  <!-- NODE 6: SPA INFINITE SCROLL -->
  <rect x="32" y="236" width="220" height="140" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="44" y="246" width="86" height="18" rx="3" fill="#047857"/>
  <text x="87" y="259" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">CLIENT RENDER</text>
  <text x="44" y="282" font-size="11.5" font-weight="600" fill="#064E3B">INFINITE SCROLL</text>
  <line x1="44" y1="290" x2="240" y2="290" stroke="#A7F3D0" stroke-width="1"/>
  <text x="44" y="306" font-size="8" fill="#065F46">• Virtualized Document List</text>
  <text x="44" y="320" font-size="8" fill="#065F46">• IntersectionObserver Triggers</text>
  <text x="44" y="334" font-size="8" fill="#065F46">• Automatic Next Page Keyset Query</text>
  <rect x="44" y="344" width="196" height="22" rx="3" fill="#FFFFFF" stroke="#047857" stroke-width="0.75"/>
  <text x="52" y="359" font-size="7.5" font-weight="600" fill="#047857">O(1) Scroll Performance</text>

  <!-- Horizontal Connectors Row 2 -->
  <line x1="548" y1="306" x2="510" y2="306" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="290" y1="306" x2="252" y2="306" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Performance Callout Banner -->
  <rect x="32" y="388" width="736" height="30" rx="4" fill="#F0FDF4" stroke="#047857" stroke-width="1"/>
  <text x="44" y="407" font-size="8.5" font-weight="600" fill="#064E3B">KEYSET PERFORMANCE:</text>
  <text x="175" y="407" font-size="8" fill="#047857">By omitting SQL COUNT(*) and utilizing (createdAt, id) composite indexing, pagination maintains O(1) execution regardless of page depth.</text>
  <text x="756" y="407" font-size="8" font-weight="600" fill="#064E3B" text-anchor="end">O(1) SCAN</text>

  <!-- Bottom Annotation -->
  <text x="400" y="434" font-size="8.5" fill="#64748B" text-anchor="middle">SPA filters through FastAPI and HMAC-signed data Worker; D1 keyset page returns at most 50 items with next cursor for infinite scroll.</text>
</svg>
