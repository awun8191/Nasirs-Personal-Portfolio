<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Soiling Detection - CSI Construction</title>
  <desc>Composite Soiling Index construction from five environmental features. Each feature is standardised to a z-score using clean-day baselines, sign-corrected by its direction of soiling shift, and weighted by the absolute Cohen's d of its class separation. The weighted sum is the CSI, fed to a one-sided lower CUSUM. Operating point k=0.50, H=-0.30 (sigma_CSI=0.743973, training data only). No camera input: all five features are humidity, temperature-spread, irradiance and temperature signals.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
  <!-- five feature sources -->
  <g font-size="10" text-anchor="middle">
    <rect x="30" y="34" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/><text x="90.0" y="58.0" fill="#1C1917" font-weight="600">3D MEAN HUM</text><text x="90.0" y="75.0" fill="#78716C">w=1.152</text>
    <rect x="30" y="110" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/><text x="90.0" y="134.0" fill="#1C1917" font-weight="600">3D MIN HUM</text><text x="90.0" y="151.0" fill="#78716C">w=0.837</text>
    <rect x="30" y="186" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/><text x="90.0" y="210.0" fill="#1C1917" font-weight="600">TEMP SPREAD</text><text x="90.0" y="227.0" fill="#78716C">w=0.766</text>
    <rect x="30" y="262" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/><text x="90.0" y="286.0" fill="#1C1917" font-weight="600">IRRADIANCE</text><text x="90.0" y="303.0" fill="#78716C">w=0.513</text>
    <rect x="30" y="338" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/><text x="90.0" y="362.0" fill="#1C1917" font-weight="600">MEAN TEMP</text><text x="90.0" y="379.0" fill="#78716C">w=0.251</text>
  </g>
  <!-- standardize + weight block -->
  <rect x="190" y="170" width="150" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="265.0" y="200.0" font-size="11" fill="#92400E" text-anchor="middle" font-weight="600">STANDARDISE</text>
  <text x="265.0" y="220.0" font-size="10" fill="#1C1917" text-anchor="middle">z_j = (x_j-mu_j)/sigma_j</text>
  <text x="265.0" y="250.0" font-size="11" fill="#92400E" text-anchor="middle" font-weight="600">WEIGHT</text>
  <text x="265.0" y="270.0" font-size="10" fill="#1C1917" text-anchor="middle">w_j = |Cohen's d_j|</text>
  <text x="265.0" y="270.0" font-size="10" fill="#1C1917" text-anchor="middle"></text>
  <!-- CSI -->
  <rect x="372" y="186" width="150" height="78" rx="8" fill="#92400E" stroke="#92400E" stroke-width="1.25"/>
  <text x="447.0" y="216.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">CSI</text>
  <text x="447.0" y="236.0" font-size="10" fill="#FDE68A" text-anchor="middle">sum s_j w_j z_j</text>
  <text x="447.0" y="252.0" font-size="10" fill="#FDE68A" text-anchor="middle">/ sum w_j</text>
  <!-- CUSUM -->
  <rect x="554" y="186" width="216" height="78" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="662.0" y="214.0" font-size="12" fill="#1C1917" text-anchor="middle" font-weight="600">ONE-SIDED LOWER CUSUM</text>
  <text x="662.0" y="234.0" font-size="10" fill="#92400E" text-anchor="middle">S_i = min(0, S_(i-1)+z_i+k)</text>
  <text x="662.0" y="252.0" font-size="10" fill="#92400E" text-anchor="middle">alarm when S_i &lt; H</text>
  <!-- alarm -->
  <rect x="554" y="308" width="216" height="56" rx="8" fill="#92400E" stroke="#92400E" stroke-width="1.25"/>
  <text x="662.0" y="332.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">ALARM</text>
  <text x="662.0" y="350.0" font-size="10" fill="#FDE68A" text-anchor="middle">k=0.50  H=-0.30</text>
  <!-- connectors -->
  <path d="M150 62 L172 62 Q190 62 190 200 L190 225" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M150 138 L190 138 Q190 220 190 220" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M150 214 L190 214" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M150 290 L190 290 Q190 224 190 224" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M150 366 L190 366 Q190 226 190 226" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M340 225 L372 225" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M522 225 L554 225" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M662 264 L662 308" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="400" y="424" font-size="11" fill="#92400E" text-anchor="middle">Humidity is 26x more discriminative than the old single signal (Cohen's d 1.152 vs 0.045). All five inputs are environmental; no camera data enters the CSI.</text>
</svg>
