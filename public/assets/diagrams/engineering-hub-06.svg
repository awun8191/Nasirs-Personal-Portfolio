<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Engineering Hub - Caching Layers</title>
  <desc>Three caching layers cut catalog read cost: the Cloudflare Worker edge cache with Cache-Control public max-age=300 and CDN s-maxage 3600-86400, a one-year immutable asset cache on hashed filenames, and a React Query cache with staleTimes of 5/2/1 minutes that invalidates on write.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M30 40 L30 392" fill="none" stroke="#5B21B6" stroke-width="1.5" marker-end="url(#chev)"/>
<text x="30" y="225" font-size="11" font-weight="700" fill="#5B21B6" text-anchor="middle" transform="rotate(-90 30 225)">READ PATH</text>
<rect x="70" y="40" width="680" height="90" rx="10" fill="#F5F3FF" stroke="#5B21B6" stroke-width="1.25"/><text x="92" y="77.0" font-size="15" font-weight="700" fill="#2A2440">Worker Edge Cache</text><text x="92" y="97.0" font-size="11" fill="#6D28D9">Cache-Control: public, max-age=300</text><text x="728" y="90.0" font-size="11" fill="#5B21B6" text-anchor="end" font-weight="600">CDN s-maxage 3600-86400</text>
<rect x="70" y="170" width="680" height="90" rx="10" fill="#F5F3FF" stroke="#5B21B6" stroke-width="1.25"/><text x="92" y="207.0" font-size="15" font-weight="700" fill="#2A2440">Immutable Asset Cache</text><text x="92" y="227.0" font-size="11" fill="#6D28D9">hashed filenames · 1-year immutable</text><text x="728" y="220.0" font-size="11" fill="#5B21B6" text-anchor="end" font-weight="600"></text>
<rect x="70" y="300" width="680" height="90" rx="10" fill="#F5F3FF" stroke="#5B21B6" stroke-width="1.25"/><text x="92" y="337.0" font-size="15" font-weight="700" fill="#2A2440">React Query Cache</text><text x="92" y="357.0" font-size="11" fill="#6D28D9">staleTime 5 / 2 / 1 min</text><text x="728" y="350.0" font-size="11" fill="#5B21B6" text-anchor="end" font-weight="600">invalidate on write</text>
<path d="M410.0 130 L410.0 158 Q 410.0 170 410.0 170" fill="none" stroke="#5B21B6" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#chev)"/>
<path d="M410.0 260 L410.0 288 Q 410.0 300 410.0 300" fill="none" stroke="#5B21B6" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#chev)"/>
  <text x="400" y="438" font-size="11" fill="#6D28D9" text-anchor="middle">Three read layers keep catalog reads cheap; timings documented in repo.</text>
</svg>
