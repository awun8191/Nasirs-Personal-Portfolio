<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>NUESA Academia - Analytics Flow</title>
  <desc>Analytics query execution flow: requests to /api/analytics/lms first check the Cloudflare Cache API (max-age 300s). On hit, cached payload returns immediately. On miss, six D1 SQL queries execute in a single Promise.all, results assemble into a unified LMS payload, save to cache, and stream to client. Any upload, edit, or deletion mutation invalidates the cache key.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#047857" letter-spacing="0.12em">NUESA · 06 / ANALYTICS FLOW</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">CACHE-FIRST · 6× D1 PROMISE.ALL · MUTATION BUST</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- COLUMN 1: INGRESS & CACHE CHECK -->
  <!-- 1A: INGRESS REQUEST -->
  <rect x="32" y="62" width="180" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="42" y="72" width="56" height="16" rx="3" fill="#E2E8F0"/>
  <text x="70" y="84" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">INGRESS</text>
  <text x="42" y="103" font-size="10.5" font-weight="600" fill="#0F172A">GET /analytics/lms</text>
  <text x="42" y="115" font-size="8" fill="#64748B">Faculty Dashboard Request</text>

  <!-- Line 1A to 1B -->
  <line x1="122" y1="122" x2="122" y2="142" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- 1B: CACHE EVALUATION -->
  <rect x="32" y="142" width="180" height="88" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="42" y="152" width="76" height="16" rx="3" fill="#E2E8F0"/>
  <text x="80" y="164" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">CACHE CHECK</text>
  <text x="42" y="183" font-size="10.5" font-weight="600" fill="#0F172A">caches.default</text>
  <text x="42" y="197" font-size="8" fill="#475569">Key: analytics/lms-v2</text>
  <text x="42" y="210" font-size="8" fill="#475569">TTL: 300s (5-min max-age)</text>
  <text x="42" y="222" font-size="7.5" font-weight="600" fill="#047857">Hit / Miss Evaluation</text>

  <!-- Hit branch down to 1C -->
  <line x1="122" y1="230" x2="122" y2="256" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="127" y="247" font-size="7.5" font-weight="600" fill="#047857">HIT</text>

  <!-- 1C: CACHED RETURN -->
  <rect x="32" y="256" width="180" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="42" y="266" width="66" height="16" rx="3" fill="#047857"/>
  <text x="75" y="278" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">CACHE HIT</text>
  <text x="42" y="297" font-size="10.5" font-weight="600" fill="#064E3B">INSTANT RETURN</text>
  <text x="42" y="311" font-size="8" fill="#065F46">Payload &lt; 15 ms · 0 SQL Cost</text>

  <!-- Miss branch from 1B to Col 2 -->
  <line x1="212" y1="186" x2="240" y2="186" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="216" y="180" font-size="7.5" font-weight="600" fill="#047857">MISS</text>

  <!-- COLUMN 2: PROMISE.ALL DISPATCHER -->
  <rect x="240" y="62" width="105" height="264" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="250" y="72" width="85" height="16" rx="3" fill="#E2E8F0"/>
  <text x="292" y="84" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">PARALLEL HUB</text>
  <text x="250" y="112" font-size="11" font-weight="600" fill="#0F172A">Promise.all</text>
  <line x1="250" y1="120" x2="335" y2="120" stroke="#E2E8F0" stroke-width="1"/>
  <text x="250" y="140" font-size="8" fill="#475569">Concurrent</text>
  <text x="250" y="154" font-size="8" fill="#475569">Fan-Out to</text>
  <text x="250" y="168" font-size="8" fill="#475569">6 Isolated</text>
  <text x="250" y="182" font-size="8" fill="#475569">D1 Queries</text>
  <line x1="250" y1="196" x2="335" y2="196" stroke="#E2E8F0" stroke-width="1"/>
  <text x="250" y="218" font-size="8" fill="#64748B">Single DB</text>
  <text x="250" y="232" font-size="8" fill="#64748B">Roundtrip</text>
  <rect x="250" y="284" width="85" height="30" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="0.75"/>
  <text x="256" y="297" font-size="7" font-weight="600" fill="#047857">EXECUTION:</text>
  <text x="256" y="307" font-size="7" fill="#065F46">Parallel SQL</text>

  <!-- Line from Hub to Distribution Trunk -->
  <line x1="345" y1="194" x2="362" y2="194" stroke="#047857" stroke-width="1.5"/>
  <!-- Distribution Trunk -->
  <line x1="362" y1="81" x2="362" y2="306" stroke="#047857" stroke-width="1.5"/>

  <!-- Branches into 6 Queries -->
  <line x1="362" y1="81" x2="378" y2="81" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="362" y1="126" x2="378" y2="126" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="362" y1="171" x2="378" y2="171" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="362" y1="216" x2="378" y2="216" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="362" y1="261" x2="378" y2="261" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="362" y1="306" x2="378" y2="306" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- COLUMN 3: 6 PARALLEL D1 QUERIES -->
  <!-- Q1: OVERVIEW -->
  <rect x="378" y="62" width="222" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="390" y="78" font-size="9" font-weight="600" fill="#0F172A">Q1: OVERVIEW AGGREGATES</text>
  <text x="390" y="92" font-size="8" fill="#64748B">Total courses, docs, coverage % &amp; status buckets</text>

  <!-- Q2: DEPARTMENT -->
  <rect x="378" y="107" width="222" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="390" y="123" font-size="9" font-weight="600" fill="#0F172A">Q2: DEPARTMENT COVERAGE</text>
  <text x="390" y="137" font-size="8" fill="#64748B">Document totals across 9 engineering departments</text>

  <!-- Q3: LEVEL -->
  <rect x="378" y="152" width="222" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="390" y="168" font-size="9" font-weight="600" fill="#0F172A">Q3: LEVEL DISTRIBUTION</text>
  <text x="390" y="182" font-size="8" fill="#64748B">Course material counts across 100L to 500L</text>

  <!-- Q4: UNDERSERVED -->
  <rect x="378" y="197" width="222" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="390" y="213" font-size="9" font-weight="600" fill="#0F172A">Q4: UNDERSERVED COURSES</text>
  <text x="390" y="227" font-size="8" fill="#64748B">Zero-material syllabus list flagged for ingestion</text>

  <!-- Q5: HEATMAP -->
  <rect x="378" y="242" width="222" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="390" y="258" font-size="9" font-weight="600" fill="#0F172A">Q5: MATRIX HEATMAP</text>
  <text x="390" y="272" font-size="8" fill="#64748B">9 departments × 5 levels density breakdown</text>

  <!-- Q6: ORPHANS -->
  <rect x="378" y="287" width="222" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="390" y="303" font-size="9" font-weight="600" fill="#0F172A">Q6: ORPHAN CHECK</text>
  <text x="390" y="317" font-size="8" fill="#64748B">Audit count of docs unlinked to syllabus codes</text>

  <!-- Exits to Collector Trunk -->
  <line x1="600" y1="81" x2="618" y2="81" stroke="#047857" stroke-width="1.5"/>
  <line x1="600" y1="126" x2="618" y2="126" stroke="#047857" stroke-width="1.5"/>
  <line x1="600" y1="171" x2="618" y2="171" stroke="#047857" stroke-width="1.5"/>
  <line x1="600" y1="216" x2="618" y2="216" stroke="#047857" stroke-width="1.5"/>
  <line x1="600" y1="261" x2="618" y2="261" stroke="#047857" stroke-width="1.5"/>
  <line x1="600" y1="306" x2="618" y2="306" stroke="#047857" stroke-width="1.5"/>

  <!-- Collector Trunk -->
  <line x1="618" y1="81" x2="618" y2="306" stroke="#047857" stroke-width="1.5"/>
  <!-- Collector to Assembler -->
  <line x1="618" y1="194" x2="636" y2="194" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- COLUMN 4: ASSEMBLE & CACHE SET -->
  <rect x="636" y="62" width="132" height="264" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="646" y="72" width="76" height="16" rx="3" fill="#047857"/>
  <text x="684" y="84" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">ASSEMBLE</text>
  <text x="646" y="112" font-size="11" font-weight="600" fill="#064E3B">PAYLOAD BUILD</text>
  <line x1="646" y1="120" x2="756" y2="120" stroke="#A7F3D0" stroke-width="1"/>
  <text x="646" y="140" font-size="8" fill="#065F46">• Join 6 Streams</text>
  <text x="646" y="154" font-size="8" fill="#065F46">• Build LMS Metric</text>
  <text x="646" y="168" font-size="8" fill="#065F46">• Format Heatmap</text>
  <line x1="646" y1="182" x2="756" y2="182" stroke="#A7F3D0" stroke-width="1"/>
  <text x="646" y="202" font-size="8" font-weight="600" fill="#047857">CACHE WRITE:</text>
  <text x="646" y="216" font-size="8" fill="#065F46">caches.default.put</text>
  <text x="646" y="230" font-size="8" fill="#065F46">TTL: 300 Seconds</text>
  <rect x="646" y="284" width="112" height="30" rx="3" fill="#FFFFFF" stroke="#047857" stroke-width="0.75"/>
  <text x="652" y="297" font-size="7" font-weight="600" fill="#047857">DISPATCH:</text>
  <text x="652" y="307" font-size="7" fill="#065F46">200 OK JSON Body</text>

  <!-- MUTATION CACHE BUST BANNER -->
  <rect x="32" y="346" width="736" height="42" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1"/>
  <rect x="44" y="357" width="96" height="20" rx="3" fill="#047857"/>
  <text x="92" y="371" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">MUTATION BUST</text>
  <text x="150" y="371" font-size="8.5" fill="#064E3B">On PDF Upload, Update, or Delete: caches.default.delete(key) purges analytics cache instantly.</text>
  <text x="756" y="371" font-size="8" font-weight="600" fill="#047857" text-anchor="end">ZERO STALE READS</text>

  <!-- Bottom Annotation -->
  <text x="400" y="416" font-size="8.5" fill="#64748B" text-anchor="middle">Cache lookup first; on miss, six parallel D1 queries build the coverage payload, cached for 5 minutes and purged on any mutation.</text>
</svg>
