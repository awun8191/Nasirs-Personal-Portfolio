<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>AWUN - Relational Data Model (Cloudflare D1)</title>
  <desc>Relational schema of 10 Cloudflare D1 tables across Catalog, Commerce, and Outbox domains, featuring atomic stock reservation tracking, money stored in integer kobo, and webhook event idempotency.</desc>
  <defs>
    <marker id="arrow-terracotta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1.5 1.5 L6.5 4 L1.5 6.5" fill="none" stroke="#8B4513" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#8B4513" letter-spacing="0.12em">AWUN / 05 · RELATIONAL SCHEMA (CLOUDFLARE D1)</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#78716C" text-anchor="end">10 TABLES · 22 INDEXES · KOBO INTEGERS</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E7E5E4" stroke-width="1"/>

  <!-- ==================== CLUSTER 1: CATALOG DOMAIN ==================== -->
  <rect x="32" y="58" width="224" height="344" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <rect x="42" y="68" width="80" height="18" rx="3" fill="#F5EBE1"/>
  <text x="82" y="80" font-size="8" font-weight="600" fill="#8B4513" text-anchor="middle">CATALOG</text>

  <!-- Table 1: vendors -->
  <rect x="42" y="94" width="204" height="66" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="52" y="110" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: vendors</text>
  <text x="52" y="126" font-size="8" fill="#8B4513">id <tspan fill="#78716C">INTEGER PRIMARY KEY</tspan></text>
  <text x="52" y="139" font-size="8" fill="#1C1917">firebase_uid <tspan fill="#78716C">TEXT UNIQUE</tspan></text>
  <text x="52" y="152" font-size="8" fill="#1C1917">slug <tspan fill="#78716C">TEXT UNIQUE · store_name</tspan></text>

  <!-- Table 2: products -->
  <rect x="42" y="168" width="204" height="66" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="52" y="184" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: products</text>
  <text x="52" y="200" font-size="8" fill="#8B4513">id <tspan fill="#78716C">INTEGER PRIMARY KEY</tspan></text>
  <text x="52" y="213" font-size="8" fill="#8B4513">vendor_id <tspan fill="#78716C">INTEGER FK</tspan></text>
  <text x="52" y="226" font-size="8" fill="#1C1917">title, base_price_kobo, status</text>

  <!-- Table 3: product_variants -->
  <rect x="42" y="242" width="204" height="74" rx="4" fill="#FFFFFF" stroke="#8B4513" stroke-width="1.25"/>
  <text x="52" y="258" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: product_variants</text>
  <text x="52" y="274" font-size="8" fill="#8B4513">id <tspan fill="#78716C">INTEGER PRIMARY KEY</tspan></text>
  <text x="52" y="287" font-size="8" fill="#8B4513">product_id <tspan fill="#78716C">INTEGER FK</tspan></text>
  <text x="52" y="300" font-size="8" fill="#047857">stock_qty, reserved_qty</text>
  <text x="52" y="312" font-size="7" fill="#78716C">CHECK (stock_qty &gt;= reserved_qty)</text>

  <!-- Table 4: product_images -->
  <rect x="42" y="324" width="204" height="66" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="52" y="340" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: product_images</text>
  <text x="52" y="356" font-size="8" fill="#8B4513">id <tspan fill="#78716C">INTEGER PK</tspan></text>
  <text x="52" y="369" font-size="8" fill="#8B4513">product_id <tspan fill="#78716C">INTEGER FK</tspan></text>
  <text x="52" y="382" font-size="8" fill="#1C1917">r2_key <tspan fill="#78716C">TEXT · is_primary BOOL</tspan></text>

  <!-- ==================== CLUSTER 2: COMMERCE & STATE ==================== -->
  <rect x="280" y="58" width="240" height="344" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <rect x="290" y="68" width="90" height="18" rx="3" fill="#F5EBE1"/>
  <text x="335" y="80" font-size="8" font-weight="600" fill="#8B4513" text-anchor="middle">COMMERCE</text>

  <!-- Table 5: checkouts -->
  <rect x="290" y="94" width="220" height="82" rx="4" fill="#FFFFFF" stroke="#8B4513" stroke-width="1.25"/>
  <text x="300" y="110" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: checkouts</text>
  <text x="300" y="126" font-size="8" fill="#8B4513">id <tspan fill="#78716C">TEXT PRIMARY KEY (UUID)</tspan></text>
  <text x="300" y="139" font-size="8" fill="#8B4513">vendor_id <tspan fill="#78716C">INTEGER FK</tspan></text>
  <text x="300" y="152" font-size="8" fill="#1C1917">status: <tspan fill="#8B4513">open / paid / expired / cancel</tspan></text>
  <text x="300" y="165" font-size="8" fill="#1C1917">expires_at <tspan fill="#78716C">TIMESTAMP (30-MIN)</tspan></text>

  <!-- Table 6: stock_reservations -->
  <rect x="290" y="184" width="220" height="96" rx="4" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.5"/>
  <text x="300" y="200" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: stock_reservations</text>
  <text x="300" y="216" font-size="8" fill="#8B4513">id <tspan fill="#78716C">INTEGER PRIMARY KEY</tspan></text>
  <text x="300" y="229" font-size="8" fill="#8B4513">checkout_id <tspan fill="#78716C">TEXT FK</tspan></text>
  <text x="300" y="242" font-size="8" fill="#8B4513">variant_id <tspan fill="#78716C">INTEGER FK</tspan></text>
  <text x="300" y="255" font-size="8" fill="#1C1917">quantity <tspan fill="#78716C">INTEGER</tspan></text>
  <text x="300" y="268" font-size="7.5" fill="#8B4513">status: <tspan fill="#047857">active</tspan> / <tspan fill="#78716C">consumed</tspan> / <tspan fill="#B91C1C">released</tspan></text>

  <!-- Table 7: orders -->
  <rect x="290" y="288" width="220" height="102" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="300" y="304" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: orders</text>
  <text x="300" y="320" font-size="8" fill="#8B4513">id <tspan fill="#78716C">TEXT PRIMARY KEY (UUID)</tspan></text>
  <text x="300" y="333" font-size="8" fill="#8B4513">checkout_id <tspan fill="#78716C">TEXT FK (UNIQUE)</tspan></text>
  <text x="300" y="346" font-size="8" fill="#1C1917">amount_kobo, delivery_fee_kobo</text>
  <text x="300" y="359" font-size="8" fill="#1C1917">customer_name, customer_phone</text>
  <text x="300" y="372" font-size="8" fill="#047857">status: new / processing / fulfilled</text>

  <!-- ==================== CLUSTER 3: INFRASTRUCTURE ==================== -->
  <rect x="544" y="58" width="224" height="344" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <rect x="554" y="68" width="110" height="18" rx="3" fill="#F5EBE1"/>
  <text x="609" y="80" font-size="8" font-weight="600" fill="#8B4513" text-anchor="middle">INFRASTRUCTURE</text>

  <!-- Table 8: webhook_events -->
  <rect x="554" y="94" width="204" height="82" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="564" y="110" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: webhook_events</text>
  <text x="564" y="126" font-size="8" fill="#8B4513">id <tspan fill="#78716C">INTEGER PRIMARY KEY</tspan></text>
  <text x="564" y="139" font-size="8" fill="#8B4513">event_key <tspan fill="#78716C">TEXT UNIQUE</tspan></text>
  <text x="564" y="152" font-size="8" fill="#1C1917">provider <tspan fill="#78716C">'paystack'</tspan></text>
  <text x="564" y="165" font-size="7.5" fill="#8B4513">Guarantees idempotency</text>

  <!-- Table 9: email_outbox -->
  <rect x="554" y="184" width="204" height="82" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="564" y="200" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: email_outbox</text>
  <text x="564" y="216" font-size="8" fill="#8B4513">id <tspan fill="#78716C">INTEGER PRIMARY KEY</tspan></text>
  <text x="564" y="229" font-size="8" fill="#8B4513">order_id <tspan fill="#78716C">TEXT FK</tspan></text>
  <text x="564" y="242" font-size="8" fill="#1C1917">recipient, template, status</text>
  <text x="564" y="255" font-size="7.5" fill="#8B4513">Drain cron via Resend</text>

  <!-- Table 10: product_embeddings -->
  <rect x="554" y="274" width="204" height="82" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="564" y="290" font-size="9.5" font-weight="600" fill="#1C1917">TABLE: product_embeddings</text>
  <text x="564" y="306" font-size="8" fill="#8B4513">product_id <tspan fill="#78716C">INTEGER PK</tspan></text>
  <text x="564" y="319" font-size="8" fill="#1C1917">vector_id <tspan fill="#78716C">TEXT</tspan></text>
  <text x="564" y="332" font-size="8" fill="#1C1917">dimensions <tspan fill="#78716C">256</tspan></text>
  <text x="564" y="345" font-size="7.5" fill="#8B4513">Sync flag for Vectorize</text>

  <!-- Intra-Domain Relationships (Orthogonal) -->
  <path d="M246 279 L280 232" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M510 339 L544 225" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>

  <!-- Footer -->
  <line x1="32" y1="416" x2="768" y2="416" stroke="#E7E5E4" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#78716C">AWUN / 05 OF 08 · D1 Relational Schema</text>
  <text x="768" y="434" font-size="8.5" fill="#78716C" text-anchor="end">Source: docs/case-studies/awun.md sections 2.4 &amp; 5.2</text>
</svg>
