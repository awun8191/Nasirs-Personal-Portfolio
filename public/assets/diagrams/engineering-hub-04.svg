<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Engineering Hub - System Architecture</title>
  <desc>A React web SPA and a Flutter Android app both call one Cloudflare Worker API fronted by the LearningCoordinator Durable Object. Firebase Auth verifies the ID token, Firestore holds profiles and schedules, Gemini powers the assistant, and D1 is the authoritative learning store. R2 is not on the runtime client path.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="10" y="40" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="110.0" y="64.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">React Web</text><text x="110.0" y="79.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">React 19 + Vite</text>
<rect x="10" y="140" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="110.0" y="164.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Flutter Android</text><text x="110.0" y="179.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">BLoC + GetX</text>
<rect x="300" y="70" width="210" height="90" rx="8" fill="#6D28D9" stroke="#5B21B6" stroke-width="1.25"/><text x="405.0" y="100.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">Worker API</text><text x="405.0" y="115.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">+ LearningCoordinator</text><text x="405.0" y="130.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">(Durable Object)</text>
<rect x="580" y="90" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="680.0" y="117.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">D1 (SQLite)</text><text x="680.0" y="132.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">authoritative store</text>
<rect x="10" y="250" width="200" height="54" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.25" stroke-dasharray="6 4"/><text x="110.0" y="269.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Firebase Auth</text><text x="110.0" y="284.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">verifies ID token</text>
<rect x="580" y="250" width="200" height="54" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.25" stroke-dasharray="6 4"/><text x="680.0" y="269.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Firestore</text><text x="680.0" y="284.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">profiles · schedules</text>
<rect x="300" y="250" width="210" height="54" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.25" stroke-dasharray="6 4"/><text x="405.0" y="269.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Gemini</text><text x="405.0" y="284.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">assistant (boundary)</text>
