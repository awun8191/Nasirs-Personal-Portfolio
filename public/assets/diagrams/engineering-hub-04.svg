<path d="M210 277 L210 350 Q210 360 220 360 L405 360 Q415 360 415 350 L415 160" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M405.0 250 L405.0 172 Q 405.0 160 405.0 160" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M680.0 250 L680.0 172 Q 680.0 160 680.0 160" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
