<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>AWUN - Paystack Webhook Sequence</title>
  <desc>Sequence diagram illustrating Paystack webhook processing: Inbound webhook verification via HMAC-SHA512, idempotent event locking in D1, atomic stock decrement, order and email outbox commit, and 200 OK acknowledgment.</desc>
  <defs>
    <marker id="arrow-terracotta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1.5 1.5 L6.5 4 L1.5 6.5" fill="none" stroke="#8B4513" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1.5 1.5 L6.5 4 L1.5 6.5" fill="none" stroke="#059669" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#8B4513" letter-spacing="0.12em">AWUN / 08 · PAYSTACK WEBHOOK SEQUENCE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#78716C" text-anchor="end">IDEMPOTENT ORDER COMMIT</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E7E5E4" stroke-width="1"/>

  <!-- ==================== LIFELINES ==================== -->
  <!-- Lifeline 1: Paystack -->
  <rect x="40" y="58" width="160" height="38" rx="4" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="120" y="74" font-size="9.5" font-weight="600" fill="#1C1917" text-anchor="middle">PAYSTACK GATEWAY</text>
  <text x="120" y="87" font-size="7.5" fill="#78716C" text-anchor="middle">External Webhook Host</text>
  <line x1="120" y1="96" x2="120" y2="370" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Lifeline 2: Cloud Run FastAPI -->
  <rect x="320" y="58" width="160" height="38" rx="4" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.5"/>
  <text x="400" y="74" font-size="9.5" font-weight="600" fill="#8B4513" text-anchor="middle">CLOUD RUN FASTAPI</text>
  <text x="400" y="87" font-size="7.5" fill="#78716C" text-anchor="middle">Core Business Logic</text>
  <line x1="400" y1="96" x2="400" y2="370" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Lifeline 3: D1 & Outbox -->
  <rect x="600" y="58" width="160" height="38" rx="4" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="680" y="74" font-size="9.5" font-weight="600" fill="#1C1917" text-anchor="middle">D1 SQL &amp; OUTBOX</text>
  <text x="680" y="87" font-size="7.5" fill="#78716C" text-anchor="middle">Internal Data Worker</text>
  <line x1="680" y1="96" x2="680" y2="370" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== SEQUENCE INTERACTIONS ==================== -->
  <!-- Message 1: Inbound Webhook -->
  <path d="M120 120 L394 120" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <text x="250" y="114" font-size="8.5" font-weight="600" fill="#1C1917" text-anchor="middle">1. POST /webhooks/paystack</text>
  <text x="250" y="132" font-size="7.5" fill="#78716C" text-anchor="middle">Header: X-Paystack-Signature</text>

  <!-- Action 2: Verify HMAC -->
  <rect x="375" y="142" width="50" height="24" rx="3" fill="#8B4513"/>
  <text x="400" y="157" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">VERIFY</text>
  <text x="435" y="157" font-size="8" fill="#8B4513">2. HMAC-SHA512 over raw body</text>

  <!-- Message 3: Lock Event -->
  <path d="M400 185 L674 185" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <text x="540" y="179" font-size="8.5" font-weight="600" fill="#1C1917" text-anchor="middle">3. INSERT webhook_events (event_id)</text>

  <!-- Message 4: Lock Ack -->
  <path d="M680 215 L406 215" fill="none" stroke="#8B4513" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arrow-terracotta)"/>
  <text x="540" y="209" font-size="8" fill="#047857" text-anchor="middle">4. Idempotent lock acquired (rows == 1)</text>

  <!-- Message 5: Atomic Stock Commit -->
  <path d="M400 250 L674 250" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <text x="540" y="244" font-size="8.5" font-weight="600" fill="#1C1917" text-anchor="middle">5. UPDATE inventory: stock -= qty, reserved -= qty</text>

  <!-- Message 6: Insert Order & Outbox -->
  <path d="M400 290 L674 290" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <text x="540" y="284" font-size="8.5" font-weight="600" fill="#1C1917" text-anchor="middle">6. INSERT orders + email_outbox</text>

  <!-- Message 7: HTTP 200 OK ACK -->
  <path d="M400 330 L126 330" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>
  <text x="250" y="324" font-size="8.5" font-weight="600" fill="#059669" text-anchor="middle">7. HTTP 200 OK (ACK received)</text>

  <!-- Summary Fallback Note -->
  <rect x="40" y="360" width="720" height="38" rx="4" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1"/>
  <text x="54" y="376" font-size="8" font-weight="600" fill="#8B4513">CLIENT CALLBACK FALLBACK:</text>
  <text x="54" y="388" font-size="7.5" fill="#78716C">If webhook delivery fails, buyer return triggers POST /api/v1/public/checkout/{id}/verify directly against Paystack API.</text>

  <!-- Footer -->
  <line x1="32" y1="416" x2="768" y2="416" stroke="#E7E5E4" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#78716C">AWUN / 08 OF 08 · Webhook Sequence</text>
  <text x="768" y="434" font-size="8.5" fill="#78716C" text-anchor="end">Source: docs/case-studies/awun.md sections 2.5 &amp; 7 #5</text>
</svg>
