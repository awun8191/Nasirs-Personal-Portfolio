<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>TRAKS - Verification System</title>
  <desc>Verification system: community members near an incident confirm it, weighted by proximity and reputation, or refute it with a reason; the confirm/refute ratio drives a status engine that auto-demotes reports past the refute threshold. No central moderator. A failure-mode matrix maps false reports, spam, outdated information, and location spoofing to their mitigations.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
  <rect x="130" y="80" width="140" height="48" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="200" y="109" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">REPORT</text>
  <rect x="45" y="165" width="150" height="60" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="120" y="192" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">CONFIRM</text>
  <text x="120" y="210" font-size="10" fill="#991B1B" text-anchor="middle">PROX + REP WEIGHT</text>
  <rect x="205" y="165" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="280" y="192" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">REFUTE</text>
  <text x="280" y="210" font-size="10" fill="#991B1B" text-anchor="middle">WITH REASON</text>
  <rect x="80" y="255" width="230" height="54" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.25"/>
  <text x="195" y="282" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">STATUS ENGINE</text>
  <text x="195" y="300" font-size="10" fill="#FECACA" text-anchor="middle">CONFIRM / REFUTE RATIO</text>
  <text x="195" y="338" font-size="11" fill="#991B1B" text-anchor="middle" font-weight="600">AUTO-DEMOTE PAST THRESHOLD</text>
  <text x="195" y="360" font-size="10" fill="#991B1B" text-anchor="middle">NO CENTRAL MODERATOR</text>
  <path d="M200 128 L200 145 L120 145 L120 165" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M200 128 L200 145 L280 145 L280 165" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M120 225 L120 240 L160 240 L160 255" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M280 225 L280 240 L230 240 L230 255" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="610" y="96" font-size="11" fill="#991B1B" text-anchor="middle" font-weight="600">FAILURE MODE  -  MITIGATION</text>
  <line x1="440" y1="112" x2="780" y2="112" stroke="#991B1B" stroke-width="0.75"/>
  <text x="440" y="126" font-size="10" fill="#991B1B" font-weight="600">FALSE REPORTS</text>
  <text x="440" y="144" font-size="11" fill="#2A1418">COMMUNITY VERIFICATION: CONFIRM-REFUTE VOTING</text>
  <line x1="440" y1="182" x2="780" y2="182" stroke="#991B1B" stroke-width="0.75"/>
  <text x="440" y="196" font-size="10" fill="#991B1B" font-weight="600">SPAM INCIDENTS</text>
  <text x="440" y="214" font-size="11" fill="#2A1418">REPUTATION WEIGHTING + RATE LIMITING</text>
  <line x1="440" y1="252" x2="780" y2="252" stroke="#991B1B" stroke-width="0.75"/>
  <text x="440" y="266" font-size="10" fill="#991B1B" font-weight="600">OUTDATED INFO</text>
  <text x="440" y="284" font-size="11" fill="#2A1418">AUTO DEMOTION AFTER REFUTE THRESHOLD</text>
  <line x1="440" y1="322" x2="780" y2="322" stroke="#991B1B" stroke-width="0.75"/>
  <text x="440" y="336" font-size="10" fill="#991B1B" font-weight="600">LOCATION SPOOFING</text>
  <text x="440" y="354" font-size="11" fill="#2A1418">GEOLOCATION VALIDATION + PROXIMITY CHECKS</text>
  <line x1="440" y1="392" x2="780" y2="392" stroke="#991B1B" stroke-width="0.75"/>
  <text x="400" y="424" font-size="10" fill="#991B1B" text-anchor="middle">No single moderator: the confirm/refute ratio governs incident status.</text>
</svg>
