<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Soiling Detection - Results Dashboard</title>
  <desc>Measured results of the two-layer system. The composite CUSUM lifted Layer 1 event recall from 29.4% (single signal) to 87.3%, a 3.0x gain; day-level F1 rose to 63.4%. The Pi Zero 2 W XGBoost confirmer reaches 99.98% accuracy on Layer-1-triggered events (precision 0.998, recall 0.999, F1 0.912). The total prototype hardware cost was N273,750 (BEME). Latency and field accuracy are not reported here.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
  <!-- LAYER 1 recall panel -->
  <rect x="30" y="40" width="340" height="150" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="50.0" y="68.0" font-size="11" fill="#1C1917" text-anchor="start" font-weight="600">LAYER 1 · EVENT RECALL</text>
  <line x1="50" y1="82" x2="350" y2="82" stroke="#B45309" stroke-width="1" stroke-opacity="0.4"/>
  <text x="50.0" y="114.0" font-size="11" fill="#78716C" text-anchor="start">single signal</text>
  <rect x="170" y="98" width="60" height="16" fill="#FED7AA" stroke="#B45309" stroke-width="1"/>
  <text x="240" y="111" font-size="11" fill="#92400E" text-anchor="start">29.4%</text>
  <text x="50.0" y="152.0" font-size="11" fill="#78716C" text-anchor="start">composite CSI</text>
  <rect x="170" y="138" width="178" height="16" fill="#92400E" stroke="#92400E" stroke-width="1"/>
  <text x="354" y="151" font-size="11" fill="#92400E" text-anchor="start">87.3%</text>
  <text x="300.0" y="190.0" font-size="11" fill="#92400E" text-anchor="end" font-weight="600">3.0x GAIN</text>
  <!-- XGBOOST panel -->
  <rect x="430" y="40" width="340" height="150" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="450.0" y="68.0" font-size="11" fill="#1C1917" text-anchor="start" font-weight="600">LAYER 2 · XGBOOST</text>
  <text x="450.0" y="68.0" font-size="11" fill="#1C1917" text-anchor="start" font-weight="600"></text>
  <line x1="450" y1="82" x2="750" y2="82" stroke="#B45309" stroke-width="1" stroke-opacity="0.4"/>
  <text x="450.0" y="118.0" font-size="11" fill="#78716C" text-anchor="start">accuracy (triggered subset)</text>
  <text x="750.0" y="118.0" font-size="16" fill="#92400E" text-anchor="end" font-weight="600">99.98%</text>
  <text x="450.0" y="146.0" font-size="11" fill="#78716C" text-anchor="start">precision / recall / f1</text>
  <text x="750.0" y="146.0" font-size="13" fill="#1C1917" text-anchor="end">0.998 / 0.999 / 0.912</text>
  <text x="450.0" y="174.0" font-size="10" fill="#92400E" text-anchor="start" font-weight="600">on Layer-1-triggered events only</text>
  <!-- CUSUM F1 panel -->
  <rect x="30" y="214" width="340" height="96" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="50.0" y="242.0" font-size="11" fill="#1C1917" text-anchor="start" font-weight="600">CUSUM DAY-LEVEL F1</text>
  <line x1="50" y1="254" x2="350" y2="254" stroke="#B45309" stroke-width="1" stroke-opacity="0.4"/>
  <text x="50.0" y="288.0" font-size="11" fill="#78716C" text-anchor="start">composite</text>
  <text x="350.0" y="288.0" font-size="16" fill="#92400E" text-anchor="end" font-weight="600">63.4%</text>
  <!-- COST panel -->
  <rect x="430" y="214" width="340" height="96" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="450.0" y="242.0" font-size="11" fill="#1C1917" text-anchor="start" font-weight="600">PROTOTYPE HARDWARE COST</text>
  <line x1="450" y1="254" x2="750" y2="254" stroke="#B45309" stroke-width="1" stroke-opacity="0.4"/>
  <text x="450.0" y="288.0" font-size="11" fill="#78716C" text-anchor="start">BEME total</text>
  <text x="750.0" y="288.0" font-size="16" fill="#92400E" text-anchor="end" font-weight="600">N273,750</text>
  <!-- honest-scope footer -->
  <rect x="30" y="334" width="740" height="74" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="50.0" y="362.0" font-size="11" fill="#92400E" text-anchor="start" font-weight="600">SCOPE NOTES (reported, not over-claimed)</text>
  <text x="50.0" y="384.0" font-size="10" fill="#1C1917" text-anchor="start">XGBoost 99.98% = Layer-1-triggered subset. CUSUM recall/F1 = held-out test set.</text>
  <text x="50.0" y="400.0" font-size="10" fill="#1C1917" text-anchor="start">No on-device latency or real-world field accuracy is shown: those benchmarks were not committed in the source repo.</text>
</svg>
