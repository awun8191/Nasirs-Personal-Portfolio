<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>AWUN - Order State Machine</title>
  <desc>State machine showing order transitions: NEW transitions to PROCESSING, then FULFILLED (terminal). CANCELLED is reachable from NEW or PROCESSING, triggering stock release.</desc>
  <defs>
    <marker id="arrow-terracotta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1.5 1.5 L6.5 4 L1.5 6.5" fill="none" stroke="#8B4513" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1.5 1.5 L6.5 4 L1.5 6.5" fill="none" stroke="#059669" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1.5 1.5 L6.5 4 L1.5 6.5" fill="none" stroke="#DC2626" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="480" fill="#FFFFFF"/>

  <!-- Title / Header -->
  <text x="24" y="24" font-size="9" font-weight="600" fill="#8B4513" letter-spacing="0.12em">AWUN / 02 · ORDER STATE MACHINE</text>
  <text x="456" y="24" font-size="8" font-weight="500" fill="#78716C" text-anchor="end">LIFECYCLE INVARIANTS</text>
  <line x1="24" y1="32" x2="456" y2="32" stroke="#E7E5E4" stroke-width="1"/>

  <!-- STATE 1: NEW -->
  <rect x="40" y="70" width="165" height="74" rx="6" fill="#FDFBF7" stroke="#8B4513" stroke-width="1.25"/>
  <rect x="52" y="80" width="48" height="16" rx="3" fill="#F5EBE1"/>
  <text x="76" y="91" font-size="7.5" font-weight="600" fill="#8B4513" text-anchor="middle">INITIAL</text>
  <text x="52" y="112" font-size="12" font-weight="600" fill="#1C1917">NEW</text>
  <text x="52" y="127" font-size="8" fill="#78716C">Payment verified via webhook</text>
  <text x="52" y="137" font-size="7.5" fill="#8B4513">Stock committed from reserve</text>

  <!-- Happy Path Arrow: NEW -> PROCESSING -->
  <path d="M205 107 L271 107" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <text x="238" y="99" font-size="7.5" font-weight="600" fill="#8B4513" text-anchor="middle">accept</text>

  <!-- STATE 2: PROCESSING -->
  <rect x="275" y="70" width="165" height="74" rx="6" fill="#FDFBF7" stroke="#8B4513" stroke-width="1.25"/>
  <rect x="287" y="80" width="60" height="16" rx="3" fill="#F5EBE1"/>
  <text x="317" y="91" font-size="7.5" font-weight="600" fill="#8B4513" text-anchor="middle">ACTIVE</text>
  <text x="287" y="112" font-size="12" font-weight="600" fill="#1C1917">PROCESSING</text>
  <text x="287" y="127" font-size="8" fill="#78716C">Vendor packaging items</text>
  <text x="287" y="137" font-size="7.5" fill="#8B4513">Delivery courier assigned</text>

  <!-- Happy Path Arrow: PROCESSING -> FULFILLED -->
  <path d="M357 144 L357 206" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="367" y="178" font-size="7.5" font-weight="600" fill="#059669">dispatch</text>

  <!-- STATE 3: FULFILLED (TERMINAL SUCCESS) -->
  <rect x="275" y="210" width="165" height="74" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <rect x="287" y="220" width="64" height="16" rx="3" fill="#DCFCE7"/>
  <text x="319" y="231" font-size="7.5" font-weight="600" fill="#166534" text-anchor="middle">TERMINAL</text>
  <text x="287" y="252" font-size="12" font-weight="600" fill="#065F46">FULFILLED</text>
  <text x="287" y="267" font-size="8" fill="#15803D">Buyer confirmed delivery</text>
  <text x="287" y="277" font-size="7.5" fill="#047857">Subaccount payout triggered</text>

  <!-- Cancellation Paths: NEW -> CANCELLED -->
  <path d="M122 144 L122 206" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="112" y="178" font-size="7.5" font-weight="600" fill="#DC2626" text-anchor="end">buyer cancel</text>

  <!-- Cancellation Paths: PROCESSING -> CANCELLED -->
  <path d="M275 125 L230 125 Q220 125 220 135 L220 237 Q220 247 213 247 L209 247" fill="none" stroke="#DC2626" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arrow-red)"/>
  <text x="228" y="200" font-size="7" font-weight="600" fill="#DC2626">vendor abort</text>

  <!-- STATE 4: CANCELLED (TERMINAL ABORT) -->
  <rect x="40" y="210" width="165" height="74" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.25"/>
  <rect x="52" y="220" width="64" height="16" rx="3" fill="#FEE2E2"/>
  <text x="84" y="231" font-size="7.5" font-weight="600" fill="#991B1B" text-anchor="middle">TERMINAL</text>
  <text x="52" y="252" font-size="12" font-weight="600" fill="#991B1B">CANCELLED</text>
  <text x="52" y="267" font-size="8" fill="#B91C1C">Order voided / refunded</text>
  <text x="52" y="277" font-size="7.5" fill="#DC2626">Stock returned to catalog</text>

  <!-- Informational Rules Ledger -->
  <rect x="40" y="312" width="400" height="96" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <text x="54" y="330" font-size="8.5" font-weight="600" fill="#8B4513">STATE TRANSITION RULES &amp; GUARANTEES</text>
  <line x1="54" y1="338" x2="426" y2="338" stroke="#E7E5E4" stroke-width="0.75"/>
  
  <text x="54" y="356" font-size="8" font-weight="600" fill="#1C1917">NOTIFICATIONS:</text>
  <text x="140" y="356" font-size="8" fill="#78716C">Resend triggers transactional emails on every state change.</text>
  
  <text x="54" y="374" font-size="8" font-weight="600" fill="#1C1917">STOCK INTEGRITY:</text>
  <text x="140" y="374" font-size="8" fill="#78716C">Cancellation invokes atomic SQL: reserved_quantity -= QTY.</text>

  <text x="54" y="392" font-size="8" font-weight="600" fill="#1C1917">IDEMPOTENCY:</text>
  <text x="140" y="392" font-size="8" fill="#78716C">Duplicate status updates guarded by database rowversion.</text>

  <!-- Footer -->
  <line x1="24" y1="430" x2="456" y2="430" stroke="#E7E5E4" stroke-width="1"/>
  <text x="24" y="448" font-size="8" fill="#78716C">AWUN / 02 OF 08 · Order State Machine</text>
  <text x="456" y="448" font-size="8" fill="#78716C" text-anchor="end">Source: docs/case-studies/awun.md section 3</text>
</svg>
