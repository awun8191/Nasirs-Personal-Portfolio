<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>AWUN - Multimodal Search Pipeline</title>
  <desc>Search pipeline: Multimodal vector encoding (text and image embeddings fused and L2-normalized to 256 dimensions, upserted to Vectorize) with query execution and self-healing degraded fallback paths in D1.</desc>
  <defs>
    <marker id="arrow-terracotta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#8B4513" letter-spacing="0.12em">AWUN / 04 · MULTIMODAL SEARCH PIPELINE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#78716C" text-anchor="end">256-DIM FUSED VECTORS</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E7E5E4" stroke-width="1"/>

  <!-- ==================== TIER 1: ENCODING PIPELINE ==================== -->
  <rect x="32" y="56" width="736" height="150" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <text x="44" y="74" font-size="8.5" font-weight="600" fill="#8B4513">PHASE 1: INGESTION &amp; MULTIMODAL EMBEDDING</text>
  <line x1="44" y1="80" x2="756" y2="80" stroke="#E7E5E4" stroke-width="0.75"/>

  <!-- Card 1: Product Write -->
  <rect x="44" y="92" width="154" height="98" rx="5" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="54" y="110" font-size="8" font-weight="600" fill="#8B4513">STEP 01</text>
  <text x="54" y="126" font-size="10.5" font-weight="600" fill="#1C1917">PRODUCT WRITE</text>
  <line x1="54" y1="134" x2="188" y2="134" stroke="#E7E5E4" stroke-width="0.75"/>
  <text x="54" y="148" font-size="8" fill="#78716C">Title, Specs, Category</text>
  <text x="54" y="162" font-size="8" fill="#78716C">Primary Image Upload</text>
  <text x="54" y="176" font-size="7.5" fill="#8B4513">Vendor Catalog Event</text>

  <!-- Card 2: Dual Embed -->
  <rect x="226" y="92" width="160" height="98" rx="5" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="236" y="110" font-size="8" font-weight="600" fill="#8B4513">STEP 02</text>
  <text x="236" y="126" font-size="10.5" font-weight="600" fill="#1C1917">DUAL EMBEDDING</text>
  <line x1="236" y1="134" x2="376" y2="134" stroke="#E7E5E4" stroke-width="0.75"/>
  <text x="236" y="148" font-size="8" fill="#78716C">Text: gemini-embed-001</text>
  <text x="236" y="162" font-size="8" fill="#78716C">Vision: Image Embed</text>
  <text x="236" y="176" font-size="7.5" fill="#8B4513">Target: 256 Dimensions</text>

  <!-- Card 3: Fuse & Normalize -->
  <rect x="414" y="92" width="160" height="98" rx="5" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="424" y="110" font-size="8" font-weight="600" fill="#8B4513">STEP 03</text>
  <text x="424" y="126" font-size="10.5" font-weight="600" fill="#1C1917">FUSE &amp; NORMALIZE</text>
  <line x1="424" y1="134" x2="564" y2="134" stroke="#E7E5E4" stroke-width="0.75"/>
  <text x="424" y="148" font-size="8" fill="#78716C">Unit Vector Average</text>
  <text x="424" y="162" font-size="8" fill="#78716C">Strict L2-Normalization</text>
  <text x="424" y="176" font-size="7.5" fill="#8B4513">MTEB: 66.19 @ 256d</text>

  <!-- Card 4: Vectorize Upsert -->
  <rect x="602" y="92" width="154" height="98" rx="5" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.5"/>
  <text x="612" y="110" font-size="8" font-weight="600" fill="#8B4513">STEP 04</text>
  <text x="612" y="126" font-size="10.5" font-weight="600" fill="#1C1917">VECTORIZE UPSERT</text>
  <line x1="612" y1="134" x2="746" y2="134" stroke="#D7CCC8" stroke-width="0.75"/>
  <text x="612" y="148" font-size="8" fill="#78716C">Cloudflare Vectorize</text>
  <text x="612" y="162" font-size="8" fill="#78716C">Metadata: vendor_id</text>
  <text x="612" y="176" font-size="7.5" fill="#8B4513">Index: awun-products</text>

  <!-- Connectors -->
  <path d="M198 141 L226 141" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <path d="M386 141 L414 141" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <path d="M574 141 L602 141" fill="none" stroke="#8B4513" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>

  <!-- ==================== TIER 2: QUERY & FALLBACKS ==================== -->
  <!-- Left Box: Query Pipeline -->
  <rect x="32" y="218" width="370" height="184" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <text x="44" y="238" font-size="8.5" font-weight="600" fill="#8B4513">PHASE 2A: ONLINE QUERY &amp; HYDRATION</text>
  <line x1="44" y1="246" x2="390" y2="246" stroke="#E7E5E4" stroke-width="0.75"/>

  <rect x="44" y="258" width="346" height="54" rx="4" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1"/>
  <text x="56" y="276" font-size="9.5" font-weight="600" fill="#1C1917">TOP-K VECTOR SEARCH</text>
  <text x="56" y="292" font-size="8" fill="#78716C">Embeds query string via BGE / Gemini $\rightarrow$ Cosine distance</text>
  <text x="56" y="304" font-size="7.5" fill="#8B4513">Scoped by active vendor filter in Vectorize query params</text>

  <path d="M217 312 L217 326" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>

  <rect x="44" y="328" width="346" height="58" rx="4" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.25"/>
  <text x="56" y="346" font-size="9.5" font-weight="600" fill="#1C1917">RELATIONAL D1 HYDRATION</text>
  <text x="56" y="362" font-size="8" fill="#78716C">Fetches full product cards, inventory quantity, variants</text>
  <text x="56" y="374" font-size="7.5" fill="#8B4513">Single coarse-grained batch SQL query (1 HTTP round trip)</text>

  <!-- Right Box: Fallback Paths -->
  <rect x="414" y="218" width="354" height="184" rx="6" fill="#FDFBF7" stroke="#E7E5E4" stroke-width="1.25"/>
  <text x="426" y="238" font-size="8.5" font-weight="600" fill="#8B4513">PHASE 2B: DEGRADED PATHS &amp; SELF-HEALING</text>
  <line x1="426" y1="246" x2="756" y2="246" stroke="#E7E5E4" stroke-width="0.75"/>

  <!-- Fallback 1: Keyword -->
  <rect x="426" y="258" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="274" font-size="8.5" font-weight="600" fill="#1C1917">KEYWORD LIKE FALLBACK</text>
  <text x="436" y="288" font-size="7.5" fill="#78716C">Vectorize timeout triggers D1 SQL LIKE on name &amp; description</text>

  <!-- Fallback 2: Self-Heal -->
  <rect x="426" y="304" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="320" font-size="8.5" font-weight="600" fill="#1C1917">INDEX SELF-HEALING (HTTP 410)</text>
  <text x="436" y="334" font-size="7.5" fill="#78716C">FastAPI boot check detects deleted index and auto-recreates graph</text>

  <!-- Fallback 3: Reindex -->
  <rect x="426" y="350" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="366" font-size="8.5" font-weight="600" fill="#1C1917">ASYNC REINDEXING ENDPOINT</text>
  <text x="436" y="380" font-size="7.5" fill="#78716C">POST /search/reindex re-evaluates all vendor catalog vectors</text>

  <!-- Footer -->
  <line x1="32" y1="418" x2="768" y2="418" stroke="#E7E5E4" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#78716C">AWUN / 04 OF 08 · Search Pipeline</text>
  <text x="768" y="434" font-size="8.5" fill="#78716C" text-anchor="end">Source: docs/case-studies/awun.md sections 4.1 &amp; 4.2</text>
</svg>
