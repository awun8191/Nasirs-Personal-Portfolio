<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>NUESA Academia - Upload Pipeline</title>
  <desc>Ten-step upload pipeline: origin check, size precheck under 25 MiB, idempotency, Firebase auth verification, magic byte validation, ingress SHA-256, course-scoped dedup, R2 put, D1 commit with audit log, and analytics cache bust.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="360" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#047857" letter-spacing="0.12em">NUESA · 04 / UPLOAD PIPELINE</text>
  <text x="808" y="32" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">10-STEP EDGE GUARD · ZERO-TRUST INGESTION</text>
  <line x1="32" y1="44" x2="808" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ROW 1: INGRESS & VALIDATION (STEPS 01 - 05) -->
  <!-- STEP 01 -->
  <rect x="32" y="62" width="140" height="98" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="42" y="72" width="50" height="16" rx="3" fill="#E2E8F0"/>
  <text x="67" y="84" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">STEP 01</text>
  <text x="42" y="103" font-size="10.5" font-weight="600" fill="#0F172A">ORIGIN CHECK</text>
  <line x1="42" y1="110" x2="162" y2="110" stroke="#E2E8F0" stroke-width="1"/>
  <text x="42" y="125" font-size="8" fill="#475569">CORS Allowlist</text>
  <text x="42" y="138" font-size="8" fill="#475569">Faculty Host Gate</text>
  <text x="42" y="150" font-size="7.5" font-weight="600" fill="#047857">Browser Guard</text>

  <!-- STEP 02 -->
  <rect x="191" y="62" width="140" height="98" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="201" y="72" width="50" height="16" rx="3" fill="#E2E8F0"/>
  <text x="226" y="84" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">STEP 02</text>
  <text x="201" y="103" font-size="10.5" font-weight="600" fill="#0F172A">SIZE PRECHECK</text>
  <line x1="201" y1="110" x2="321" y2="110" stroke="#E2E8F0" stroke-width="1"/>
  <text x="201" y="125" font-size="8" fill="#475569">Content-Length</text>
  <text x="201" y="138" font-size="8" fill="#475569">Pre-Ingress Test</text>
  <text x="201" y="150" font-size="7.5" font-weight="600" fill="#047857">Max 25 MiB Cap</text>

  <!-- STEP 03 -->
  <rect x="350" y="62" width="140" height="98" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="360" y="72" width="50" height="16" rx="3" fill="#E2E8F0"/>
  <text x="385" y="84" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">STEP 03</text>
  <text x="360" y="103" font-size="10.5" font-weight="600" fill="#0F172A">IDEMPOTENCY</text>
  <line x1="360" y1="110" x2="480" y2="110" stroke="#E2E8F0" stroke-width="1"/>
  <text x="360" y="125" font-size="8" fill="#475569">X-Idempotency-Key</text>
