  <!-- STEP 05 -->
  <rect x="668" y="62" width="140" height="98" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="678" y="72" width="50" height="16" rx="3" fill="#E2E8F0"/>
  <text x="703" y="84" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">STEP 05</text>
  <text x="678" y="103" font-size="10.5" font-weight="600" fill="#0F172A">MAGIC BYTES</text>
  <line x1="678" y1="110" x2="798" y2="110" stroke="#E2E8F0" stroke-width="1"/>
  <text x="678" y="125" font-size="8" fill="#475569">Header: %PDF-</text>
  <text x="678" y="138" font-size="8" fill="#475569">MIME Validation</text>
  <text x="678" y="150" font-size="7.5" font-weight="600" fill="#047857">Binary Integrity</text>

  <!-- Connectors Row 1 -->
  <line x1="172" y1="111" x2="191" y2="111" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="331" y1="111" x2="350" y2="111" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="490" y1="111" x2="509" y2="111" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="649" y1="111" x2="668" y2="111" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

