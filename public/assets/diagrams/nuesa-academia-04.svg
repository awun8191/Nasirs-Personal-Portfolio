  <text x="42" y="257" font-size="8" fill="#065F46">Streaming Ingress</text>
  <text x="42" y="270" font-size="8" fill="#065F46">Chunked Digest</text>
  <text x="42" y="282" font-size="7.5" font-weight="600" fill="#047857">Hash Fingerprint</text>

  <!-- STEP 07 -->
  <rect x="191" y="194" width="140" height="98" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="201" y="204" width="50" height="16" rx="3" fill="#047857"/>
  <text x="226" y="216" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 07</text>
  <text x="201" y="235" font-size="10.5" font-weight="600" fill="#064E3B">COURSE DEDUP</text>
  <line x1="201" y1="242" x2="321" y2="242" stroke="#A7F3D0" stroke-width="1"/>
  <text x="201" y="257" font-size="8" fill="#065F46">D1 Hash Index</text>
  <text x="201" y="270" font-size="8" fill="#065F46">Course Scope</text>
  <text x="201" y="282" font-size="7.5" font-weight="600" fill="#047857">Reject Duplicate</text>

  <!-- STEP 08 -->
  <rect x="350" y="194" width="140" height="98" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="360" y="204" width="50" height="16" rx="3" fill="#047857"/>
  <text x="385" y="216" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 08</text>
  <text x="360" y="235" font-size="10.5" font-weight="600" fill="#064E3B">R2 OBJECT PUT</text>
  <line x1="360" y1="242" x2="480" y2="242" stroke="#A7F3D0" stroke-width="1"/>
  <text x="360" y="257" font-size="8" fill="#065F46">Immutable Store</text>
  <text x="360" y="270" font-size="8" fill="#065F46">Key: UUID.pdf</text>
  <text x="360" y="282" font-size="7.5" font-weight="600" fill="#047857">Zero Egress</text>

  <!-- STEP 09 -->
  <rect x="509" y="194" width="140" height="98" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="519" y="204" width="50" height="16" rx="3" fill="#047857"/>
  <text x="544" y="216" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 09</text>
  <text x="519" y="235" font-size="10.5" font-weight="600" fill="#064E3B">D1 PUBLISH</text>
  <line x1="519" y1="242" x2="639" y2="242" stroke="#A7F3D0" stroke-width="1"/>
  <text x="519" y="257" font-size="8" fill="#065F46">SQL Row Insert</text>
  <text x="519" y="270" font-size="8" fill="#065F46">Audit Log Event</text>
  <text x="519" y="282" font-size="7.5" font-weight="600" fill="#047857">Status: Published</text>

  <!-- STEP 10 -->
  <rect x="668" y="194" width="140" height="98" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="678" y="204" width="50" height="16" rx="3" fill="#047857"/>
  <text x="703" y="216" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 10</text>
  <text x="678" y="235" font-size="10.5" font-weight="600" fill="#064E3B">CACHE BUST</text>
  <line x1="678" y1="242" x2="798" y2="242" stroke="#A7F3D0" stroke-width="1"/>
  <text x="678" y="257" font-size="8" fill="#065F46">Cache API Purge</text>
  <text x="678" y="270" font-size="8" fill="#065F46">Analytics Invalidation</text>
  <text x="678" y="282" font-size="7.5" font-weight="600" fill="#047857">Instant Consistency</text>

  <!-- Connectors Row 2 -->
  <line x1="172" y1="243" x2="191" y2="243" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="331" y1="243" x2="350" y2="243" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="490" y1="243" x2="509" y2="243" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="649" y1="243" x2="668" y2="243" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Footer Banner -->
  <rect x="32" y="304" width="776" height="28" rx="4" fill="#F0FDF4" stroke="#047857" stroke-width="1"/>
  <text x="44" y="322" font-size="8.5" font-weight="600" fill="#064E3B">EDGE INGRESS PROTOCOL:</text>
  <text x="180" y="322" font-size="8" fill="#047857">Dual-gate validation (Origin + Auth + Magic Bytes) ensures invalid payloads never touch R2 or D1.</text>
  <text x="796" y="322" font-size="8" font-weight="600" fill="#064E3B" text-anchor="end">MAX 25 MiB / PDF</text>

  <!-- Bottom Annotation -->
  <text x="420" y="348" font-size="8.5" fill="#64748B" text-anchor="middle">Deterministic edge upload pipeline: verified authentication, streaming SHA-256 hash, R2 immutable store, and atomic D1 commit.</text>
