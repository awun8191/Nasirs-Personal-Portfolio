<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>AWUN - System Architecture</title>
  <desc>System Architecture: Browser clients connect through Cloudflare Pages and API proxy to Google Cloud Run FastAPI backend, which orchestrates Cloudflare D1, R2, Vectorize, Firebase Auth, Paystack, and Resend.</desc>
  <defs>
    <marker id="arrow-terracotta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-stone" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#57534E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#8B4513" letter-spacing="0.12em">AWUN / 01 · SYSTEM ARCHITECTURE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#78716C" text-anchor="end">EDGE TO CONTAINER TOPOLOGY</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E7E5E4" stroke-width="1"/>

  <!-- TIER 1: CLIENT SURFACES -->
  <rect x="32" y="56" width="224" height="58" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="44" y="76" font-size="8" font-weight="600" fill="#8B4513">CLIENT SURFACE 01</text>
  <text x="44" y="93" font-size="11" font-weight="600" fill="#1C1917">VENDOR DASHBOARD</text>
  <text x="44" y="105" font-size="8" fill="#78716C">awun.dev (React 19 SPA)</text>

  <rect x="288" y="56" width="224" height="58" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="300" y="76" font-size="8" font-weight="600" fill="#8B4513">CLIENT SURFACE 02</text>
  <text x="300" y="93" font-size="11" font-weight="600" fill="#1C1917">BUYER CHECKOUT</text>
  <text x="300" y="105" font-size="8" fill="#78716C">checkout.awun.dev (Direct Link)</text>

  <rect x="544" y="56" width="224" height="58" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="556" y="76" font-size="8" font-weight="600" fill="#8B4513">CLIENT SURFACE 03</text>
  <text x="556" y="93" font-size="11" font-weight="600" fill="#1C1917">PAYSTACK MODAL</text>
  <text x="556" y="105" font-size="8" fill="#78716C">Hosted Gateway / Cards / Transfer</text>

  <!-- Connectors T1 -> T2 -->
  <path d="M144 114 L144 130" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M400 114 L400 130" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M656 114 L656 122 Q656 128 646 128 L593 128 Q583 128 583 134 L583 138" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>

  <!-- TIER 2: CLOUDFLARE EDGE ROUTING -->
  <rect x="32" y="138" width="350" height="58" rx="6" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.25"/>
  <text x="44" y="156" font-size="8.5" font-weight="600" fill="#8B4513">CLOUDFLARE PAGES &amp; FUNCTIONS</text>
  <text x="44" y="172" font-size="11" font-weight="600" fill="#1C1917">STATIC SPA + PROXY</text>
  <text x="44" y="186" font-size="8" fill="#78716C">Edge routing /api/[[path]].ts with CORS hygiene</text>

  <rect x="418" y="138" width="350" height="58" rx="6" fill="#F5EBE1" stroke="#8B4513" stroke-width="1.25"/>
  <text x="430" y="156" font-size="8.5" font-weight="600" fill="#8B4513">CLOUDFLARE WORKER PROXY</text>
  <text x="430" y="172" font-size="11" font-weight="600" fill="#1C1917">awun-api-proxy (api.awun.dev)</text>
  <text x="430" y="186" font-size="8" fill="#78716C">Low-latency path &amp; method forwarding to Cloud Run</text>

  <!-- Connectors T2 -> T3 -->
  <path d="M207 196 L207 212" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M593 196 L593 212" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>

  <!-- TIER 3: BACKEND API (CLOUD RUN) -->
  <rect x="32" y="218" width="736" height="72" rx="6" fill="#8B4513" stroke="#5D2E0C" stroke-width="1.5"/>
  <rect x="44" y="228" width="100" height="18" rx="3" fill="#5D2E0C"/>
  <text x="94" y="240" font-size="8" font-weight="600" fill="#F5EBE1" text-anchor="middle">PYTHON FASTAPI</text>
  <text x="156" y="242" font-size="12" font-weight="600" fill="#FFFFFF">GOOGLE CLOUD RUN BACKEND SERVICE</text>
  <text x="756" y="242" font-size="8.5" font-weight="500" fill="#F5EBE1" text-anchor="end">minScale: 0 · maxScale: 3 · 512 MiB</text>

  <line x1="44" y1="254" x2="756" y2="254" stroke="#A0522D" stroke-width="0.75"/>
  <text x="44" y="274" font-size="8.5" fill="#F5EBE1">DOMAINS: /orders · /products · /checkouts · /vendors · /inventory · /webhooks/paystack · /search</text>

  <!-- Connectors T3 -> T4 -->
  <path d="M88 290 L88 310" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M212 290 L212 310" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M336 290 L336 310" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M460 290 L460 310" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M584 290 L584 310" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>
  <path d="M710 290 L710 310" fill="none" stroke="#8B4513" stroke-width="1.25" marker-end="url(#arrow-terracotta)"/>

  <!-- TIER 4: DATA & SERVICES -->
  <!-- D1 -->
  <rect x="32" y="316" width="112" height="82" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="42" y="334" font-size="8" font-weight="600" fill="#8B4513">D1 SQL</text>
  <text x="42" y="352" font-size="10.5" font-weight="600" fill="#1C1917">awun-db</text>
  <text x="42" y="368" font-size="8" fill="#78716C">10 Tables</text>
  <text x="42" y="382" font-size="8" fill="#78716C">22 Indexes</text>

  <!-- R2 -->
  <rect x="156" y="316" width="112" height="82" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="166" y="334" font-size="8" font-weight="600" fill="#8B4513">R2 BUCKET</text>
  <text x="166" y="352" font-size="10.5" font-weight="600" fill="#1C1917">awun-assets</text>
  <text x="166" y="368" font-size="8" fill="#78716C">Product Media</text>
  <text x="166" y="382" font-size="8" fill="#78716C">Zero Egress</text>

  <!-- Vectorize -->
  <rect x="280" y="316" width="112" height="82" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="290" y="334" font-size="8" font-weight="600" fill="#8B4513">VECTORIZE</text>
  <text x="290" y="352" font-size="10.5" font-weight="600" fill="#1C1917">Index 256d</text>
  <text x="290" y="368" font-size="8" fill="#78716C">Cosine Metric</text>
  <text x="290" y="382" font-size="8" fill="#78716C">Hybrid Search</text>

  <!-- Firebase -->
  <rect x="404" y="316" width="112" height="82" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="414" y="334" font-size="8" font-weight="600" fill="#8B4513">AUTH</text>
  <text x="414" y="352" font-size="10.5" font-weight="600" fill="#1C1917">Firebase</text>
  <text x="414" y="368" font-size="8" fill="#78716C">Vendor Tokens</text>
  <text x="414" y="382" font-size="8" fill="#78716C">Session Verify</text>

  <!-- Paystack -->
  <rect x="528" y="316" width="112" height="82" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="538" y="334" font-size="8" font-weight="600" fill="#8B4513">PAYMENT</text>
  <text x="538" y="352" font-size="10.5" font-weight="600" fill="#1C1917">Paystack</text>
  <text x="538" y="368" font-size="8" fill="#78716C">HMAC-SHA512</text>
  <text x="538" y="382" font-size="8" fill="#78716C">Subaccounts</text>

  <!-- Resend -->
  <rect x="652" y="316" width="116" height="82" rx="6" fill="#FDFBF7" stroke="#D7CCC8" stroke-width="1.25"/>
  <text x="662" y="334" font-size="8" font-weight="600" fill="#8B4513">EMAIL</text>
  <text x="662" y="352" font-size="10.5" font-weight="600" fill="#1C1917">Resend</text>
  <text x="662" y="368" font-size="8" fill="#78716C">Outbox Drain</text>
  <text x="662" y="382" font-size="8" fill="#78716C">Order Receipts</text>

  <!-- Footer -->
  <line x1="32" y1="418" x2="768" y2="418" stroke="#E7E5E4" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#78716C">AWUN / 01 OF 08 · System Architecture</text>
  <text x="768" y="434" font-size="8.5" fill="#78716C" text-anchor="end">Source: docs/case-studies/awun.md sections 2 &amp; 5</text>
</svg>
