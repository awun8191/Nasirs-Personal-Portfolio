<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Engineering Hub - Flashcard Lifecycle</title>
  <desc>Wrong answer or an AGAIN review shows the card; the student rates AGAIN/HARD/GOOD/EASY; the card reschedules with stability S doubling on correct qualified reviews and halving on incorrect, with a minimum 0.25 day spacing; it returns to the due deck.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="10" y="118" width="150" height="64" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.25"/><text x="85.0" y="142.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">WRONG ANSWER</text><text x="85.0" y="157.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">or AGAIN REVIEW</text>
<rect x="190" y="118" width="110" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="245.0" y="150.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">CARD</text>
<rect x="330" y="110" width="150" height="80" rx="8" fill="#6D28D9" stroke="#5B21B6" stroke-width="1.25"/><text x="405.0" y="142.5" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">AGAIN / HARD</text><text x="405.0" y="157.5" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">GOOD / EASY</text>
<rect x="520" y="118" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="590.0" y="150.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">RESCHEDULE</text><text x="590.0" y="166.0" font-size="10" fill="#6D28D9" text-anchor="middle">S x2 / x0.5 · min 0.25d</text>
<rect x="700" y="118" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="765.0" y="150.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">DUE DECK</text>
<path d="M160 150.0 L178 150.0 Q 190 150.0 190 150.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M300 150.0 L318 150.0 Q 330 150.0 330 150.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M480 150.0 L508 150.0 Q 520 150.0 520 150.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M660 150.0 L688 150.0 Q 700 150.0 700 150.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M765 182 L765 270 Q765 280 755 280 L255 280 Q245 280 245 270 L245 182" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<text x="505" y="273" font-size="9" fill="#5B21B6" text-anchor="middle" font-weight="600">REVIEW WHEN DUE</text>
  <text x="420" y="348" font-size="11" fill="#6D28D9" text-anchor="middle">S doubles on a correct qualified review, halves on incorrect · minimum spacing 0.25 day (approx 6h) · spaced reviews grow stability</text>
</svg>
