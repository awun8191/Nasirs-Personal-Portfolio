  <path d="M420 154 L440 154" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M420 218 L440 218" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M420 282 L440 282" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M420 346 L440 346" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="400" y="418" font-size="10" fill="#991B1B" text-anchor="middle">Flutter client to FastAPI orchestrator; Workers edge logic, Firebase auth plus Firestore realtime, R2 media, Vectorize semantic index.</text>
