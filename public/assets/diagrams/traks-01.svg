<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>TRAKS - Hero Architecture</title>
  <desc>Flutter Android-first client reports incidents through the FastAPI backend orchestrator, which fans out to Cloudflare Workers for edge logic, Firebase Auth and Firestore for authentication and realtime data, Cloudflare R2 for media storage, and Cloudflare Vectorize for the semantic incident index.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
  <rect x="24" y="70" width="120" height="310" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="84" y="222" font-size="14" fill="#2A1418" text-anchor="middle" font-weight="600">FLUTTER</text>
  <text x="84" y="242" font-size="14" fill="#2A1418" text-anchor="middle" font-weight="600">CLIENT</text>
  <text x="84" y="264" font-size="10" fill="#991B1B" text-anchor="middle">ANDROID-FIRST</text>
  <rect x="190" y="190" width="170" height="70" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.25"/>
  <text x="275" y="218" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600">FASTAPI</text>
  <text x="275" y="238" font-size="11" fill="#FECACA" text-anchor="middle">ORCHESTRATION</text>
  <rect x="440" y="64" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="610" y="92" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">CLOUDFLARE WORKERS</text>
  <text x="610" y="108" font-size="10" fill="#991B1B" text-anchor="middle">EDGE LOGIC</text>
  <rect x="440" y="128" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="610" y="156" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">FIREBASE AUTH</text>
  <text x="610" y="172" font-size="10" fill="#991B1B" text-anchor="middle">AUTHENTICATION</text>
  <rect x="440" y="192" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="610" y="220" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">FIRESTORE</text>
  <text x="610" y="236" font-size="10" fill="#991B1B" text-anchor="middle">REALTIME DATA</text>
  <rect x="440" y="256" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="610" y="284" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">CLOUDFLARE R2</text>
  <text x="610" y="300" font-size="10" fill="#991B1B" text-anchor="middle">MEDIA STORAGE</text>
  <rect x="440" y="320" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="610" y="348" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">CLOUDFLARE VECTORIZE</text>
  <text x="610" y="364" font-size="10" fill="#991B1B" text-anchor="middle">SEMANTIC INDEX</text>
