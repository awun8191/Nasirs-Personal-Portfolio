<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 342" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>RAG Data Pipeline - Hero Architecture</title>
  <desc>Full pipeline inside the ink hero: source PDFs to Cloudflare R2 storage and Firestore metadata, OpenCV orientation correction, bi-stage OCR with EasyOCR fast path and Gemma 3:27b fallback, chunking, BGE-M3 embeddings, the Chroma / Vectorize vector store, metadata-filtered scoped retrieval, and JSON-schema-controlled Google Gemini generation that returns the answer.</desc>
  <defs><marker id="chev" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 5 L1.5 8.5" fill="none" stroke="#22d3ee" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="798" height="342" fill="#0b1a20"/>
  <!-- top row: ingestion -->
  <rect x="34" y="66" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="86.0" y="101.0" font-size="12" fill="#eafdff" text-anchor="middle" font-weight="500">SOURCE PDFS</text>
  <rect x="159" y="66" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="211.0" y="92.0" font-size="11" fill="#eafdff" text-anchor="middle" font-weight="500">R2 STORAGE</text><text x="211.0" y="108.0" font-size="11" fill="#9fe9f5" text-anchor="middle">FIRESTORE META</text>
  <rect x="284" y="66" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="336.0" y="92.0" font-size="11" fill="#eafdff" text-anchor="middle" font-weight="500">OPENCV</text><text x="336.0" y="108.0" font-size="11" fill="#9fe9f5" text-anchor="middle">ORIENT</text>
  <rect x="409" y="66" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="461.0" y="92.0" font-size="11" fill="#eafdff" text-anchor="middle" font-weight="500">BI-STAGE OCR</text><text x="461.0" y="108.0" font-size="11" fill="#9fe9f5" text-anchor="middle">EASYOCR+G3</text>
  <rect x="534" y="66" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="586.0" y="101.0" font-size="12" fill="#eafdff" text-anchor="middle" font-weight="500">CHUNKING</text>
  <rect x="659" y="66" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="711.0" y="101.0" font-size="12" fill="#eafdff" text-anchor="middle" font-weight="500">BGE-M3 EMBED</text>
  <!-- bottom row: retrieval -->
  <rect x="34" y="206" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="86.0" y="224.0" font-size="11" fill="#eafdff" text-anchor="middle" font-weight="500">CHROMA</text><text x="86.0" y="240.0" font-size="11" fill="#9fe9f5" text-anchor="middle">VECTORIZE</text>
  <rect x="159" y="206" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="211.0" y="224.0" font-size="11" fill="#eafdff" text-anchor="middle" font-weight="500">SCOPED</text><text x="211.0" y="240.0" font-size="11" fill="#9fe9f5" text-anchor="middle">RETRIEVAL</text>
  <rect x="284" y="206" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="336.0" y="224.0" font-size="11" fill="#eafdff" text-anchor="middle" font-weight="500">GEMINI GEN</text><text x="336.0" y="240.0" font-size="11" fill="#9fe9f5" text-anchor="middle">JSON SCHEMA</text>
  <rect x="409" y="206" width="104" height="60" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/><text x="461.0" y="237.0" font-size="12" fill="#eafdff" text-anchor="middle" font-weight="600">ANSWER</text>
  <!-- connectors -->
  <path d="M138 96 L159 96" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M263 96 L284 96" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M388 96 L409 96" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M513 96 L534 96" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M638 96 L659 96" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M763 96 L784 96 Q792 96 792 104 L792 158 Q792 166 784 166 L94 166 Q86 166 86 174 L86 200" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M138 236 L159 236" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M263 236 L284 236" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M388 236 L409 236" fill="none" stroke="#22d3ee" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="430" y="160.0" font-size="9" fill="#67e8f9" text-anchor="middle" font-weight="600">STORE EMBEDDINGS</text>
  <text x="399" y="318" font-size="10" fill="#67e8f9" text-anchor="middle">Top: ingestion writes BGE-M3 embeddings to the vector store. Bottom: scoped retrieval and JSON-schema Gemini generation return a reproducible answer.</text>
</svg>
