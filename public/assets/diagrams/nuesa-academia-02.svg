<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>NUESA Academia - Data Model (Cloudflare D1)</title>
  <desc>Relational database schema in Cloudflare D1: departments map 1:N to 426 syllabus courses, courses map 1:N to 2,111 documents stored in R2, protected by an immutable audit_events table and a unique (course_id, sha256_hash) constraint.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#047857" letter-spacing="0.12em">NUESA ACADEMIA / 02 · RELATIONAL SCHEMA (CLOUDFLARE D1)</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#065F46" text-anchor="end">3RD NORMAL FORM · INTEGRITY CONSTRAINTS</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== MAIN ENTITY CARDS ==================== -->
  <!-- Table 1: departments -->
  <rect x="32" y="58" width="220" height="232" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1.25"/>
  <rect x="32" y="58" width="220" height="34" rx="6" fill="#047857"/>
  <text x="44" y="80" font-size="11" font-weight="600" fill="#FFFFFF">TABLE: departments</text>

  <text x="44" y="112" font-size="8.5" font-weight="600" fill="#064E3B">id <tspan fill="#047857">INTEGER PRIMARY KEY</tspan></text>
  <line x1="44" y1="120" x2="240" y2="120" stroke="#E2E8F0" stroke-width="0.75"/>
  <text x="44" y="138" font-size="8.5" fill="#064E3B">code <tspan fill="#059669">TEXT UNIQUE</tspan></text>
  <text x="44" y="152" font-size="7.5" fill="#065F46">(AAE, BME, CHE, CVL, EEE...)</text>
  <text x="44" y="172" font-size="8.5" fill="#064E3B">name <tspan fill="#059669">TEXT NOT NULL</tspan></text>
  <text x="44" y="190" font-size="8.5" fill="#064E3B">created_at <tspan fill="#78716C">TIMESTAMP</tspan></text>

  <rect x="44" y="236" width="196" height="42" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="54" y="253" font-size="8" font-weight="600" fill="#047857">SCOPE CARDINALITY:</text>
  <text x="54" y="267" font-size="8" fill="#065F46">9 Engineering Departments</text>

  <!-- Table 2: courses -->
  <rect x="290" y="58" width="220" height="232" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1.25"/>
  <rect x="290" y="58" width="220" height="34" rx="6" fill="#047857"/>
  <text x="302" y="80" font-size="11" font-weight="600" fill="#FFFFFF">TABLE: courses</text>

  <text x="302" y="112" font-size="8.5" font-weight="600" fill="#064E3B">id <tspan fill="#047857">INTEGER PRIMARY KEY</tspan></text>
  <line x1="302" y1="120" x2="498" y2="120" stroke="#E2E8F0" stroke-width="0.75"/>
  <text x="302" y="138" font-size="8.5" fill="#064E3B">dept_id <tspan fill="#047857">INTEGER FK</tspan></text>
  <text x="302" y="154" font-size="8.5" fill="#064E3B">code <tspan fill="#059669">TEXT (e.g. EEE301)</tspan></text>
  <text x="302" y="170" font-size="8.5" fill="#064E3B">title <tspan fill="#059669">TEXT NOT NULL</tspan></text>
  <text x="302" y="186" font-size="8.5" fill="#064E3B">level <tspan fill="#78716C">INT (100 - 500)</tspan></text>
  <text x="302" y="202" font-size="8.5" fill="#064E3B">semester <tspan fill="#78716C">INT (1 / 2)</tspan></text>

  <rect x="302" y="236" width="196" height="42" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="312" y="253" font-size="8" font-weight="600" fill="#047857">SCOPE CARDINALITY:</text>
  <text x="312" y="267" font-size="8" fill="#065F46">426 Syllabus Courses</text>

  <!-- Table 3: documents -->
  <rect x="548" y="58" width="220" height="232" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1.25"/>
  <rect x="548" y="58" width="220" height="34" rx="6" fill="#047857"/>
  <text x="560" y="80" font-size="11" font-weight="600" fill="#FFFFFF">TABLE: documents</text>

  <text x="560" y="112" font-size="8.5" font-weight="600" fill="#064E3B">id <tspan fill="#047857">TEXT PK (UUID)</tspan></text>
  <line x1="560" y1="120" x2="756" y2="120" stroke="#E2E8F0" stroke-width="0.75"/>
  <text x="560" y="138" font-size="8.5" fill="#064E3B">course_id <tspan fill="#047857">INTEGER FK</tspan></text>
  <text x="560" y="154" font-size="8.5" fill="#064E3B">title <tspan fill="#059669">TEXT NOT NULL</tspan></text>
  <text x="560" y="170" font-size="8.5" fill="#064E3B">r2_key <tspan fill="#78716C">TEXT (UUID.pdf)</tspan></text>
  <text x="560" y="186" font-size="8.5" fill="#047857">sha256_hash <tspan fill="#047857">TEXT</tspan></text>
  <text x="560" y="202" font-size="8.5" fill="#064E3B">is_pq <tspan fill="#78716C">BOOLEAN DEFAULT 0</tspan></text>

  <rect x="560" y="236" width="196" height="42" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="570" y="253" font-size="8" font-weight="600" fill="#047857">SCOPE CARDINALITY:</text>
  <text x="570" y="267" font-size="8" fill="#065F46">2,111 PDF Objects (~13.8 GB)</text>

  <!-- Relational Connectors -->
  <path d="M252 140 L290 140" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="271" y="132" font-size="8" font-weight="600" fill="#047857" text-anchor="middle">1:N</text>

  <path d="M510 140 L548 140" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="529" y="132" font-size="8" font-weight="600" fill="#047857" text-anchor="middle">1:N</text>

  <!-- ==================== TIER 2: AUDIT & CONSTRAINTS ==================== -->
  <!-- Audit Table -->
  <rect x="32" y="306" width="350" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="44" y="326" font-size="9.5" font-weight="600" fill="#064E3B">TABLE: audit_events</text>
  <line x1="44" y1="334" x2="370" y2="334" stroke="#E2E8F0" stroke-width="0.75"/>
  <text x="44" y="352" font-size="8.5" fill="#064E3B">id INTEGER PK · doc_id TEXT FK · action TEXT</text>
  <text x="44" y="368" font-size="8.5" fill="#065F46">actor_uid TEXT (Firebase) · timestamp TIMESTAMP</text>
  <text x="44" y="386" font-size="8" fill="#059669">Logs every upload, title revision, and purge mutation</text>

  <!-- Dedup Constraint -->
  <rect x="418" y="306" width="350" height="96" rx="6" fill="#F0FDF4" stroke="#047857" stroke-width="1.25"/>
  <text x="430" y="326" font-size="9.5" font-weight="600" fill="#064E3B">INGRESS INTEGRITY CONSTRAINT</text>
  <line x1="430" y1="334" x2="756" y2="334" stroke="#BBF7D0" stroke-width="0.75"/>
  <text x="430" y="352" font-size="8.5" font-weight="600" fill="#047857">UNIQUE (course_id, sha256_hash)</text>
  <text x="430" y="368" font-size="8" fill="#064E3B">Rejects duplicate PDF uploads within the same syllabus course.</text>
  <text x="430" y="386" font-size="8" fill="#059669">Enforced atomically before R2 storage object commit.</text>

  <!-- Footer -->
  <line x1="32" y1="418" x2="768" y2="418" stroke="#E2E8F0" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#065F46">NUESA ACADEMIA / 02 OF 07 · Relational Schema</text>
  <text x="768" y="434" font-size="8.5" fill="#065F46" text-anchor="end">Source: docs/case-studies/nuesa-academia.md</text>
</svg>
