<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>NUESA Academia - Data Model</title>
  <desc>Relational schema in Cloudflare D1: departments map to 426 syllabus courses, courses own documents stored in R2, documents record sha256 hashes with course-scoped unique constraints, and audit logs capture every mutation.</desc>
  <defs>
    <marker id="chev-green" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L9 6 L2 10" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="10" fill="#059669" font-weight="600">NUESA · 02 / DATA MODEL (CLOUDFLARE D1)</text>

  <!-- TABLE: DEPARTMENTS -->
  <rect x="28" y="60" width="220" height="150" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="28" y="60" width="220" height="32" rx="8" fill="#047857"/>
  <text x="138" y="81" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">TABLE: departments</text>
  <text x="44" y="112" font-size="9" fill="#064E3B" font-weight="600">id <tspan fill="#059669">INTEGER PRIMARY KEY</tspan></text>
  <text x="44" y="132" font-size="9" fill="#064E3B">code <tspan fill="#065F46">TEXT UNIQUE</tspan></text>
  <text x="56" y="148" font-size="8" fill="#059669">(AAE, BME, CHE, CVL...)</text>
  <text x="44" y="168" font-size="9" fill="#064E3B">name <tspan fill="#065F46">TEXT</tspan></text>
  <text x="44" y="188" font-size="8" fill="#065F46">created_at <tspan fill="#059669">TIMESTAMP</tspan></text>

  <!-- TABLE: COURSES -->
  <rect x="288" y="60" width="224" height="200" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="288" y="60" width="224" height="32" rx="8" fill="#047857"/>
  <text x="400" y="81" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">TABLE: courses (426 TOTAL)</text>
  <text x="304" y="112" font-size="9" fill="#064E3B" font-weight="600">id <tspan fill="#059669">INTEGER PRIMARY KEY</tspan></text>
  <text x="304" y="132" font-size="9" fill="#064E3B">dept_id <tspan fill="#065F46">INTEGER FK</tspan></text>
  <text x="304" y="152" font-size="9" fill="#064E3B">code <tspan fill="#065F46">TEXT (e.g. EEE301)</tspan></text>
  <text x="304" y="172" font-size="9" fill="#064E3B">title <tspan fill="#065F46">TEXT</tspan></text>
  <text x="304" y="192" font-size="9" fill="#064E3B">level <tspan fill="#065F46">INTEGER (100-500)</tspan></text>
  <text x="304" y="212" font-size="9" fill="#064E3B">semester <tspan fill="#065F46">INTEGER (1 / 2)</tspan></text>
  <text x="304" y="232" font-size="8" fill="#059669">INDEX: (dept_id, level, code)</text>

  <!-- TABLE: DOCUMENTS -->
  <rect x="550" y="60" width="222" height="230" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.25"/>
  <rect x="550" y="60" width="222" height="32" rx="8" fill="#047857"/>
  <text x="661" y="81" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">TABLE: documents (2,111)</text>
  <text x="566" y="112" font-size="9" fill="#064E3B" font-weight="600">id <tspan fill="#059669">TEXT PRIMARY KEY</tspan></text>
  <text x="566" y="132" font-size="9" fill="#064E3B">course_id <tspan fill="#065F46">INTEGER FK</tspan></text>
  <text x="566" y="152" font-size="9" fill="#064E3B">title <tspan fill="#065F46">TEXT</tspan></text>
  <text x="566" y="172" font-size="9" fill="#064E3B">r2_key <tspan fill="#065F46">TEXT (UUID.pdf)</tspan></text>
  <text x="566" y="192" font-size="9" fill="#064E3B">sha256_hash <tspan fill="#065F46">TEXT (HEX)</tspan></text>
  <text x="566" y="212" font-size="9" fill="#064E3B">file_size_bytes <tspan fill="#065F46">INTEGER</tspan></text>
  <text x="566" y="232" font-size="9" fill="#064E3B">is_pq <tspan fill="#065F46">BOOLEAN DEFAULT 0</tspan></text>
  <text x="566" y="252" font-size="9" fill="#064E3B">status <tspan fill="#059669">'published'</tspan></text>
  <text x="566" y="272" font-size="8" fill="#059669">created_at <tspan fill="#065F46">TIMESTAMP</tspan></text>

  <!-- AUDIT & CONSTRAINTS -->
  <rect x="28" y="290" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.25"/>
  <text x="44" y="316" font-size="11" fill="#064E3B" font-weight="600">TABLE: audit_events</text>
  <text x="44" y="338" font-size="9" fill="#065F46">id INTEGER PK · doc_id TEXT FK · action TEXT</text>
  <text x="44" y="358" font-size="9" fill="#065F46">actor_uid TEXT · timestamp TIMESTAMP</text>
  <text x="44" y="374" font-size="8" fill="#059669">Logs every upload, edit, and deletion event</text>

  <rect x="412" y="306" width="360" height="80" rx="8" fill="#047857" stroke="#065F46" stroke-width="1.25"/>
  <text x="592" y="330" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">DEDUPLICATION &amp; INTEGRITY</text>
  <text x="592" y="352" font-size="9" fill="#A7F3D0" text-anchor="middle">UNIQUE (course_id, sha256_hash)</text>
  <text x="592" y="370" font-size="8" fill="#FFFFFF" text-anchor="middle">Prevents redundant copies of identical PDF handouts</text>

  <!-- Connectors -->
  <path d="M248 135 L288 135" fill="none" stroke="#047857" stroke-width="1.25" marker-end="url(#chev-green)"/>
  <text x="268" y="127" font-size="8" fill="#047857" text-anchor="middle">1:N</text>

  <path d="M512 135 L550 135" fill="none" stroke="#047857" stroke-width="1.25" marker-end="url(#chev-green)"/>
  <text x="531" y="127" font-size="8" fill="#047857" text-anchor="middle">1:N</text>

  <path d="M661 290 L661 306" fill="none" stroke="#047857" stroke-width="1.25" marker-end="url(#chev-green)"/>

  <text x="400" y="420" font-size="10" fill="#065F46" text-anchor="middle">Clean third normal form relational model with strict foreign keys and course-scoped hash deduplication.</text>
</svg>
