<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 449" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>RAG Data Pipeline - Cost-efficiency Flow</title>
  <desc>Cost-efficiency flow: unchanged chunks hit the local chunk-hash cache and skip redundant embedding calls, while changed chunks are embedded again. Multi-versioned documents therefore avoid re-embedding the majority of their content. The up to 70% figure is a page claim, not a measured benchmark.</desc>
  <defs><marker id="chev" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 5 L1.5 8.5" fill="none" stroke="#155e75" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <!-- top: chunk in -->
  <rect x="289" y="40" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="399.0" y="65.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">CHUNK ARRIVES</text><text x="399.0" y="81.0" font-size="11" fill="#5b7785" text-anchor="middle">NEW OR REVISION</text>
  <!-- decision -->
  <rect x="289" y="170" width="220" height="64" rx="8" fill="#0e7490" stroke="#0e7490" stroke-width="1.25"/><text x="399.0" y="195.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">CHUNK-HASH CACHE?</text><text x="399.0" y="211.0" font-size="10" fill="#cbe9f2" text-anchor="middle">LOOKUP KEY</text>
  <!-- branch: unchanged -->
  <rect x="34" y="300" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="144.0" y="318.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">UNCHANGED CHUNK</text><text x="144.0" y="334.0" font-size="11" fill="#5b7785" text-anchor="middle">CACHE HIT</text>
  <rect x="63" y="380" width="162" height="50" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="144.0" y="410.0" font-size="11" fill="#0e7490" text-anchor="middle" font-weight="600">SKIP EMBEDDING</text>
  <!-- branch: changed -->
  <rect x="544" y="300" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="654.0" y="318.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">CHANGED CHUNK</text><text x="654.0" y="334.0" font-size="11" fill="#5b7785" text-anchor="middle">CACHE MISS</text>
  <rect x="573" y="380" width="162" height="50" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="654.0" y="410.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">EMBED + STORE</text>
  <!-- connectors -->
  <path d="M399 104 L399 170" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M289 202 L254 202 Q244 202 244 212 L244 300" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M509 202 L544 202 Q554 202 554 212 L554 300" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M144 364 L144 380" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M654 364 L654 380" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="399" y="442" font-size="9" fill="#0e7490" text-anchor="middle">Up to 70% pipeline cost reduction for multi-versioned docs (page claim, not a measured benchmark). Unchanged chunks reuse the cache; only changed chunks are re-embedded.</text>
</svg>
