<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>RAG Data Pipeline - Cost-Efficiency Decision Flow</title>
  <desc>Cost-efficiency decision flow: when documents are revised, chunk-level hash caching checks each segment. Unchanged chunks hit the cache and bypass embedding generation, while modified chunks invoke BGE-M3 to embed and store new vectors.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#0891B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#0891B2" letter-spacing="0.12em">COST-EFFICIENCY / CHUNK HASH DEDUPLICATION</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">INCREMENTAL INGESTION</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Step 1: Input Revision -->
  <rect x="260" y="60" width="280" height="66" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="272" y="70" width="70" height="18" rx="3" fill="#E2E8F0"/>
  <text x="307" y="82" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">INGRESS</text>
  <text x="272" y="104" font-size="11.5" font-weight="600" fill="#0F172A">DOCUMENT CHUNKS ARRIVE</text>
  <text x="272" y="118" font-size="8.5" fill="#64748B">New Material or Multi-Version Revision</text>

  <!-- Connector to Decision -->
  <path d="M400 126 L400 158" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Step 2: Decision Node -->
  <rect x="260" y="160" width="280" height="68" rx="6" fill="#0E7490" stroke="#0891B2" stroke-width="1.5"/>
  <text x="400" y="184" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">CHUNK HASH CACHE?</text>
  <text x="400" y="200" font-size="9" fill="#A5F3FC" text-anchor="middle">SHA-256 Digest Key Lookup</text>
  <text x="400" y="214" font-size="8" fill="#E0F2FE" text-anchor="middle">Compares chunk content against existing index</text>

  <!-- Left Branch: CACHE HIT -->
  <path d="M260 194 L165 194 Q155 194 155 204 L155 258" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="180" y="184" width="64" height="18" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="212" y="196" font-size="8" font-weight="600" fill="#065F46" text-anchor="middle">CACHE HIT</text>

  <rect x="32" y="260" width="246" height="74" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.25"/>
  <rect x="44" y="270" width="70" height="18" rx="3" fill="#DCFCE7"/>
  <text x="79" y="282" font-size="8" font-weight="600" fill="#166534" text-anchor="middle">UNCHANGED</text>
  <text x="44" y="304" font-size="11" font-weight="600" fill="#065F46">SKIP EMBEDDING</text>
  <text x="44" y="320" font-size="8.5" fill="#15803D">Reuse Vector Pointer · $0.00 Spend</text>

  <!-- Left Action -->
  <path d="M155 334 L155 350" fill="none" stroke="#059669" stroke-width="1.25" marker-end="url(#arrow-green)"/>
  <rect x="55" y="352" width="200" height="42" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
  <text x="65" y="369" font-size="8.5" font-weight="600" fill="#065F46">INDEX REFERENCE:</text>
  <text x="65" y="383" font-size="8" fill="#15803D">Link Existing Chunk ID to New Doc</text>

  <!-- Right Branch: CACHE MISS -->
  <path d="M540 194 L635 194 Q645 194 645 204 L645 258" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <rect x="556" y="184" width="72" height="18" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="592" y="196" font-size="8" font-weight="600" fill="#92400E" text-anchor="middle">CACHE MISS</text>

  <rect x="522" y="260" width="246" height="74" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.25"/>
  <rect x="534" y="270" width="70" height="18" rx="3" fill="#FEF3C7"/>
  <text x="569" y="282" font-size="8" font-weight="600" fill="#92400E" text-anchor="middle">NEW / EDITED</text>
  <text x="534" y="304" font-size="11" font-weight="600" fill="#92400E">COMPUTE EMBED</text>
  <text x="534" y="320" font-size="8.5" fill="#B45309">Invoke BGE-M3 · Write Vector</text>

  <!-- Right Action -->
  <path d="M645 334 L645 350" fill="none" stroke="#D97706" stroke-width="1.25" marker-end="url(#arrow-amber)"/>
  <rect x="545" y="352" width="200" height="42" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
  <text x="555" y="369" font-size="8.5" font-weight="600" fill="#92400E">UPSERT TO STORE:</text>
  <text x="555" y="383" font-size="8" fill="#B45309">Store 1024-Dim Vector &amp; Cache Entry</text>

  <!-- Footer -->
  <line x1="32" y1="418" x2="768" y2="418" stroke="#E2E8F0" stroke-width="1"/>
  <text x="32" y="434" font-size="8.5" fill="#64748B">CourseGen / Incremental Cost Efficiency</text>
  <text x="768" y="434" font-size="8.5" fill="#64748B" text-anchor="end">Source: github.com/awun8191/CourseGen</text>
</svg>
