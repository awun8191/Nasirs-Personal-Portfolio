<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Engineering Hub - Content Pipeline</title>
  <desc>The CourseGen Python pipeline (run separately, not checked into this repo) takes textbook PDFs, runs OCR with Gemini, EasyOCR or PaddleOCR, chunks text with a two-paragraph window and two-sentence overlap and SHA1 deduplication, embeds with BGE-M3, stores assets in R2, and loads the resulting question bank into D1.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="20" width="620" height="270" rx="12" fill="none" stroke="#5B21B6" stroke-width="1.25" stroke-dasharray="7 5"/><text x="34" y="44" font-size="11" font-weight="700" fill="#5B21B6">CourseGen (Python) · runs separately · sources not in this repo</text>
<rect x="40" y="120" width="120" height="80" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="100.0" y="152.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Textbook</text><text x="100.0" y="167.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">PDF</text>
<rect x="190" y="120" width="120" height="80" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="250.0" y="145.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">OCR</text><text x="250.0" y="160.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Gemini / EasyOCR</text><text x="250.0" y="175.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">PaddleOCR</text>
<rect x="340" y="120" width="120" height="90" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="400.0" y="150.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Chunk</text><text x="400.0" y="165.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">2 paras · 2-sent</text><text x="400.0" y="180.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">SHA1 dedup</text>
<rect x="490" y="120" width="120" height="80" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="550.0" y="152.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Embed</text><text x="550.0" y="167.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">BGE-M3</text>
<rect x="40" y="300" width="120" height="70" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="100.0" y="320.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">R2</text><text x="100.0" y="335.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">S3-compatible</text><text x="100.0" y="350.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">assets</text>
<rect x="640" y="300" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="705.0" y="327.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">D1</text><text x="705.0" y="342.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">question bank</text>
<path d="M160 160.0 L178 160.0 Q 190 160.0 190 160.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M310 160.0 L328 160.0 Q 340 160.0 340 165.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M460 165.0 L478 165.0 Q 490 165.0 490 160.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M550.0 200 L550.0 288 Q 550.0 300 100.0 300" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M160 335.0 L628 335.0 Q 640 335.0 640 335.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="400" y="438" font-size="11" fill="#6D28D9" text-anchor="middle">CourseGen generates the question bank off textbooks; throughput, costs and question counts are not published here.</text>
</svg>
