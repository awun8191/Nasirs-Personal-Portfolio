<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Engineering Hub - Adaptive Grading Flow</title>
  <desc>An authenticated POST /learning/answers hits the Worker API, which forwards to the LearningCoordinator Durable Object; it deduplicates by attemptId, runs the stateless BKT update, persists the new state to D1 tables, and returns the overview and the due deck.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="10" y="30" width="180" height="64" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.25"/><text x="100.0" y="54.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">POST /learning/answers</text><text x="100.0" y="69.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">(authenticated)</text>
<rect x="250" y="30" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="335.0" y="62.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">Worker (API route)</text>
<rect x="470" y="20" width="210" height="70" rx="8" fill="#6D28D9" stroke="#5B21B6" stroke-width="1.25"/><text x="575.0" y="47.5" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">LearningCoordinator</text><text x="575.0" y="62.5" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">(Durable Object)</text>
<rect x="470" y="150" width="210" height="58" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="575.0" y="179.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">dedup by attemptId</text>
<rect x="470" y="268" width="210" height="58" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="575.0" y="297.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">BKT update (stateless)</text>
<rect x="10" y="350" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="120.0" y="382.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">D1 · state tables</text><text x="120.0" y="398.0" font-size="10" fill="#6D28D9" text-anchor="middle">authoritative learning store</text>
<rect x="300" y="350" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="375.0" y="382.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">OVERVIEW</text>
<rect x="520" y="350" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="620.0" y="382.0" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">DUE DECK</text>
<path d="M190 62.0 L238 62.0 Q 250 62.0 250 62.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M420 62.0 L458 62.0 Q 470 62.0 470 55.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M575.0 90 L575.0 138 Q 575.0 150 575.0 150" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M575.0 208 L575.0 256 Q 575.0 268 575.0 268" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M575 326 L575 384 Q575 394 565 394 L130 394 Q120 394 120 384 L120 350" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M230 382.0 L288 382.0 Q 300 382.0 300 382.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M450 382.0 L508 382.0 Q 520 382.0 520 382.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="400" y="438" font-size="11" fill="#6D28D9" text-anchor="middle">Duplicate attemptId returns the cached result · BKT runs inside the Durable Object · D1 is the authoritative learning store</text>
