<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Vigil - System Architecture</title>
  <desc>Connector servers feed a FastAPI control plane. Triage turns items into action cards stored in one PostgreSQL 16 database that also holds the job queue and the vector memory. A worker claims jobs, runs the six-stage loop behind a barrier, and calls a fixed-schema Docker sandbox. External side effects wait for an approval row.</desc>
  <defs>
    <marker id="arrow-graphite" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#334155" letter-spacing="0.12em">VIGIL / 01 · SYSTEM ARCHITECTURE</text>
  <text x="768" y="32" font-size="9" font-weight="500" fill="#1E293B" text-anchor="end">ONE DATASTORE, STATELESS TURNS</text>
  <line x1="32" y1="44" x2="768" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Column 1: Inputs -->
  <rect x="32" y="60" width="172" height="330" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="42" y="70" width="64" height="17" rx="3" fill="#E2E8F0"/>
  <text x="74" y="82" font-size="8" font-weight="600" fill="#1E293B" text-anchor="middle">SOURCES</text>

  <text x="42" y="110" font-size="11" font-weight="600" fill="#0F172A">MCP CONNECTORS</text>
  <line x1="42" y1="120" x2="194" y2="120" stroke="#CBD5E1" stroke-width="0.75"/>

  <rect x="42" y="132" width="152" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="52" y="150" font-size="9" font-weight="600" fill="#1E293B">GMAIL SERVER</text>
  <text x="52" y="164" font-size="7.5" fill="#475569">poll + send tools</text>
  <text x="52" y="175" font-size="7.5" fill="#64748B">standalone process</text>

  <rect x="42" y="188" width="152" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="52" y="206" font-size="9" font-weight="600" fill="#1E293B">FUTURE SERVERS</text>
  <text x="52" y="220" font-size="7.5" fill="#475569">calendar, slack, git</text>
  <text x="52" y="231" font-size="7.5" fill="#64748B">same protocol</text>

  <text x="42" y="262" font-size="8" font-weight="600" fill="#334155">EACH TOOL HAS A POLICY:</text>
  <text x="42" y="278" font-size="7.5" fill="#475569">• read: automatic</text>
  <text x="42" y="292" font-size="7.5" fill="#475569">• write: approval row</text>
  <text x="42" y="306" font-size="7.5" fill="#475569">• send: approval row</text>

  <rect x="42" y="324" width="152" height="50" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="52" y="342" font-size="8.5" font-weight="600" fill="#334155">NO SHARED SECRET</text>
  <text x="52" y="356" font-size="7.5" fill="#475569">tokens hashed (SHA-256)</text>
  <text x="52" y="367" font-size="7.5" fill="#475569">secrets AES-256-GCM</text>

  <!-- Column 2: Control plane -->
  <rect x="224" y="60" width="172" height="330" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.25"/>
  <rect x="234" y="70" width="76" height="17" rx="3" fill="#E2E8F0"/>
  <text x="272" y="82" font-size="8" font-weight="600" fill="#1E293B" text-anchor="middle">CONTROL PLANE</text>

  <text x="234" y="110" font-size="11" font-weight="600" fill="#0F172A">FASTAPI SERVICE</text>
  <text x="234" y="124" font-size="7.5" fill="#475569">14 modules, 46 paths</text>
  <line x1="234" y1="134" x2="386" y2="134" stroke="#CBD5E1" stroke-width="0.75"/>

  <text x="234" y="152" font-size="8" font-weight="600" fill="#334155">MODULE SHAPE</text>
  <text x="234" y="166" font-size="7.5" fill="#475569">repository.py: Protocol</text>
  <text x="234" y="178" font-size="7.5" fill="#475569">service.py: mechanism</text>
  <text x="234" y="190" font-size="7.5" fill="#475569">router.py: factory</text>

  <line x1="234" y1="202" x2="386" y2="202" stroke="#CBD5E1" stroke-width="0.75"/>
  <text x="234" y="220" font-size="8" font-weight="600" fill="#334155">TRIAGE</text>
  <text x="234" y="234" font-size="7.5" fill="#475569">batch of new items</text>
  <text x="234" y="246" font-size="7.5" fill="#475569">one cheap classifier call</text>
  <text x="234" y="258" font-size="7.5" fill="#475569">result: action card</text>

  <line x1="234" y1="270" x2="386" y2="270" stroke="#CBD5E1" stroke-width="0.75"/>
  <text x="234" y="288" font-size="8" font-weight="600" fill="#334155">APPROVAL GATE</text>
  <text x="234" y="302" font-size="7.5" fill="#475569">decision row per call</text>
  <text x="234" y="314" font-size="7.5" fill="#475569">run waits, process exits</text>

  <rect x="234" y="330" width="152" height="44" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="244" y="347" font-size="8" font-weight="600" fill="#1E293B">STATELESS TURN</text>
  <text x="244" y="361" font-size="7.5" fill="#475569">no run state in memory</text>

  <!-- Column 3: Postgres -->
  <rect x="416" y="60" width="172" height="330" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="426" y="70" width="70" height="17" rx="3" fill="#E2E8F0"/>
  <text x="461" y="82" font-size="8" font-weight="600" fill="#1E293B" text-anchor="middle">DATA</text>

  <text x="426" y="110" font-size="11" font-weight="600" fill="#0F172A">POSTGRESQL 16</text>
  <text x="426" y="124" font-size="7.5" fill="#475569">one instance, three jobs</text>
  <line x1="426" y1="134" x2="578" y2="134" stroke="#CBD5E1" stroke-width="0.75"/>

  <rect x="426" y="144" width="152" height="44" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="161" font-size="8.5" font-weight="600" fill="#1E293B">RELATIONAL STATE</text>
  <text x="436" y="175" font-size="7.5" fill="#475569">runs, cards, approvals</text>
  <text x="436" y="185" font-size="7.5" fill="#64748B">18 tables of 21 required</text>

  <rect x="426" y="198" width="152" height="44" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="215" font-size="8.5" font-weight="600" fill="#1E293B">JOB QUEUE</text>
  <text x="436" y="229" font-size="7.5" fill="#475569">FOR UPDATE SKIP LOCKED</text>
  <text x="436" y="239" font-size="7.5" fill="#64748B">heartbeat, 90 s reaper</text>

  <rect x="426" y="252" width="152" height="44" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="269" font-size="8.5" font-weight="600" fill="#1E293B">VECTOR MEMORY</text>
  <text x="436" y="283" font-size="7.5" fill="#475569">pgvector, 384 dimensions</text>
  <text x="436" y="293" font-size="7.5" fill="#64748B">decay, half-life 30 days</text>

  <rect x="426" y="306" width="152" height="68" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="436" y="323" font-size="8" font-weight="600" fill="#1E293B">BOOTSTRAP</text>
  <text x="436" y="337" font-size="7.5" fill="#475569">alembic 0001 to 0003</text>
  <text x="436" y="349" font-size="7.5" fill="#475569">vector extension</text>
  <text x="436" y="361" font-size="7.5" fill="#64748B">no redis, no broker</text>

  <!-- Column 4: Execution -->
  <rect x="608" y="60" width="160" height="330" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.25"/>
  <rect x="618" y="70" width="70" height="17" rx="3" fill="#E2E8F0"/>
  <text x="653" y="82" font-size="8" font-weight="600" fill="#1E293B" text-anchor="middle">EXECUTION</text>

  <text x="618" y="110" font-size="11" font-weight="600" fill="#0F172A">WORKER</text>
  <text x="618" y="124" font-size="7.5" fill="#475569">six-stage loop</text>
  <line x1="618" y1="134" x2="758" y2="134" stroke="#CBD5E1" stroke-width="0.75"/>

  <text x="618" y="150" font-size="7.5" fill="#475569">1 load context</text>
  <text x="618" y="163" font-size="7.5" fill="#475569">2 compact context</text>
  <text x="618" y="176" font-size="7.5" fill="#475569">3 call the model</text>
  <text x="618" y="189" font-size="7.5" fill="#475569">4 partition calls</text>
  <text x="618" y="202" font-size="7.5" fill="#475569">5 execute</text>
  <text x="618" y="215" font-size="7.5" fill="#475569">6 persist</text>

  <rect x="618" y="226" width="140" height="40" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="628" y="242" font-size="8" font-weight="600" fill="#1E293B">BARRIER</text>
  <text x="628" y="255" font-size="7.5" fill="#475569">one row per call ID</text>

  <rect x="618" y="274" width="140" height="44" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="628" y="291" font-size="8.5" font-weight="600" fill="#1E293B">SANDBOX</text>
  <text x="628" y="304" font-size="7.5" fill="#475569">fixed schema, no shell</text>
  <text x="628" y="314" font-size="7.5" fill="#64748B">cpu + memory caps</text>

  <rect x="618" y="326" width="140" height="48" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="628" y="343" font-size="8" font-weight="600" fill="#1E293B">SNAPSHOT</text>
  <text x="628" y="356" font-size="7.5" fill="#475569">workspace on pause</text>
  <text x="628" y="367" font-size="7.5" fill="#64748B">rehydrate on resume</text>

  <!-- Flow arrows -->
  <line x1="204" y1="230" x2="220" y2="230" stroke="#334155" stroke-width="1.25" marker-end="url(#arrow-graphite)"/>
  <line x1="396" y1="230" x2="412" y2="230" stroke="#334155" stroke-width="1.25" marker-end="url(#arrow-graphite)"/>
  <line x1="588" y1="230" x2="604" y2="230" stroke="#334155" stroke-width="1.25" marker-end="url(#arrow-graphite)"/>

  <!-- Approval loop: below the panels, back into the control plane -->
  <path d="M688 390 L688 414 L300 414 L300 394" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-dashed)"/>
  <text x="494" y="434" font-size="7.5" fill="#64748B" text-anchor="middle">approval decision returns to the waiting run</text>
</svg>
