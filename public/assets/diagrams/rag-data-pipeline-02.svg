<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 342" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>RAG Data Pipeline - Phase A Ingestion</title>
  <desc>Phase A ingestion flow: source PDFs, OpenCV orientation correction, bi-stage OCR with EasyOCR and Gemma 3:27b fallback, text normalization, chunking, BGE-M3 embedding with local caching, then the vector database and Firestore metadata.</desc>
  <defs><marker id="chev" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L7 5 L1.5 8.5" fill="none" stroke="#155e75" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="798" height="342" fill="#FFFFFF"/>
  <rect x="34" y="118" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="80.0" y="156.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">SOURCE PDFS</text>
  <rect x="140" y="118" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="186.0" y="143.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">OPENCV</text><text x="186.0" y="159.0" font-size="11" fill="#5b7785" text-anchor="middle">ORIENT FIX</text>
  <rect x="246" y="118" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="292.0" y="143.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">BI-STAGE OCR</text><text x="292.0" y="159.0" font-size="11" fill="#5b7785" text-anchor="middle">EASYOCR+G3</text>
  <rect x="352" y="118" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="398.0" y="156.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">NORMALIZE</text>
  <rect x="458" y="118" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="504.0" y="156.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">CHUNKING</text>
  <rect x="564" y="118" width="92" height="64" rx="8" fill="#0e7490" stroke="#0e7490" stroke-width="1.25"/><text x="610.0" y="143.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">BGE-M3 EMBED</text><text x="610.0" y="159.0" font-size="11" fill="#cbe9f2" text-anchor="middle">LOCAL CACHE</text>
  <rect x="670" y="118" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#0e7490" stroke-width="1.25"/><text x="716.0" y="143.0" font-size="11" fill="#14323a" text-anchor="middle" font-weight="500">VECTOR DB</text><text x="716.0" y="159.0" font-size="11" fill="#5b7785" text-anchor="middle">FIRESTORE</text>
  <path d="M126 150 L140 150" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M232 150 L246 150" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M338 150 L352 150" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M444 150 L458 150" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M550 150 L564 150" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M656 150 L670 150" fill="none" stroke="#155e75" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="399" y="300" font-size="10" fill="#0e7490" text-anchor="middle">Phase A: orientation correction, bi-stage OCR, normalization, chunking, BGE-M3 embedding with local cache, then the vector store with Firestore metadata.</text>
