<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Elegant Radiance Luxe - 30-Minute Atomic Hold State Machine</title>
  <desc>State machine for atomic inventory reservation: checkout locks stock in a single D1 transaction with a 30-minute timestamp; payment completion via Paystack webhook commits the sale; timeout or cancellation automatically releases stock back to catalog.</desc>
  <defs>
    <marker id="chev-rose" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L9 6 L2 10" fill="none" stroke="#BE123C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="10" fill="#BE123C" font-weight="600">ERL · 02 / 30-MINUTE ATOMIC INVENTORY HOLD STATE MACHINE</text>

  <!-- Step 1: Request -->
  <rect x="28" y="70" width="180" height="90" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.25"/>
  <text x="118" y="96" font-size="11" fill="#881337" text-anchor="middle" font-weight="600">CHECKOUT START</text>
  <text x="118" y="114" font-size="9" fill="#9F1239" text-anchor="middle">CREATE &amp; RESERVE</text>
  <line x1="40" y1="124" x2="196" y2="124" stroke="#BE123C" stroke-width="0.75" stroke-opacity="0.3"/>
  <text x="118" y="142" font-size="8" fill="#BE123C" text-anchor="middle">Signed RPC to Data Worker</text>

  <!-- Step 2: D1 Atomic Lock -->
  <rect x="258" y="60" width="260" height="110" rx="8" fill="#BE123C" stroke="#9F1239" stroke-width="1.25"/>
  <text x="388" y="88" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">D1 ATOMIC TRANSACTION</text>
  <text x="388" y="106" font-size="9" fill="#FECDD3" text-anchor="middle">SINGLE ACID MUTATION</text>
  <line x1="274" y1="116" x2="502" y2="116" stroke="#FECDD3" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="274" y="136" font-size="8" fill="#FFFFFF">IF stock &gt;= qty:</text>
  <text x="286" y="152" font-size="8" fill="#FECDD3">stock = stock - qty | hold_until = NOW() + 30m</text>
  <text x="274" y="166" font-size="8" fill="#FECDD3">ELSE: HTTP 409 INSUFFICIENT_STOCK</text>

  <!-- Step 3: Active Hold -->
  <rect x="568" y="70" width="204" height="90" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.25"/>
  <text x="670" y="96" font-size="11" fill="#881337" text-anchor="middle" font-weight="600">ACTIVE HOLD (30 MIN)</text>
  <text x="670" y="114" font-size="9" fill="#9F1239" text-anchor="middle">PAYSTACK SESSION OPEN</text>
  <line x1="580" y1="124" x2="760" y2="124" stroke="#BE123C" stroke-width="0.75" stroke-opacity="0.3"/>
  <text x="670" y="142" font-size="8" fill="#BE123C" text-anchor="middle">Stock protected from rivals</text>

  <!-- Connectors top row -->
  <path d="M208 115 L258 115" fill="none" stroke="#BE123C" stroke-width="1.25" marker-end="url(#chev-rose)"/>
  <path d="M518 115 L568 115" fill="none" stroke="#BE123C" stroke-width="1.25" marker-end="url(#chev-rose)"/>

  <!-- Decision Fork -->
  <path d="M670 160 L670 210 Q670 220 658 220 L440 220" fill="none" stroke="#BE123C" stroke-width="1.25"/>
  <path d="M670 160 L670 310 Q670 320 658 320 L440 320" fill="none" stroke="#BE123C" stroke-width="1.25"/>

  <!-- Branch A: Payment Success -->
  <rect x="180" y="196" width="250" height="90" rx="8" fill="#047857" stroke="#065F46" stroke-width="1.25"/>
  <text x="305" y="222" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">BRANCH A: PAYMENT VERIFIED</text>
  <text x="305" y="240" font-size="9" fill="#A7F3D0" text-anchor="middle">PAYSTACK HMAC-SHA512 WEBHOOK</text>
  <line x1="196" y1="250" x2="414" y2="250" stroke="#A7F3D0" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="305" y="268" font-size="8" fill="#FFFFFF" text-anchor="middle">POST /v1/checkout/commit-payment</text>
  <text x="305" y="282" font-size="8" fill="#A7F3D0" text-anchor="middle">Status -> COMMITTED · Order confirmed</text>

  <!-- Branch B: Timeout / Cancel -->
  <rect x="180" y="296" width="250" height="90" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.25"/>
  <text x="305" y="322" font-size="11" fill="#881337" text-anchor="middle" font-weight="600">BRANCH B: EXPIRED / ABANDONED</text>
  <text x="305" y="340" font-size="9" fill="#9F1239" text-anchor="middle">TIMEOUT &gt; 30 MIN OR BUYER CANCEL</text>
  <line x1="196" y1="350" x2="414" y2="350" stroke="#BE123C" stroke-width="0.75" stroke-opacity="0.3"/>
  <text x="305" y="368" font-size="8" fill="#881337" text-anchor="middle">POST /v1/checkout/release-expired</text>
  <text x="305" y="382" font-size="8" fill="#BE123C" text-anchor="middle">stock = stock + qty · Stock restored</text>

  <!-- Connectors into branches -->
  <path d="M440 220 L430 220" fill="none" stroke="#047857" stroke-width="1.25" marker-end="url(#chev-rose)"/>
  <path d="M440 320 L430 320" fill="none" stroke="#BE123C" stroke-width="1.25" marker-end="url(#chev-rose)"/>

  <text x="400" y="424" font-size="10" fill="#881337" text-anchor="middle">Guaranteed zero double-selling: inventory is locked atomically in D1 and auto-reclaimed if checkout is abandoned.</text>
</svg>