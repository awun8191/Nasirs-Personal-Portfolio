<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 342" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Soiling Detection - Power Flow</title>
  <desc>Off-grid power architecture: a 20 W PV panel feeds a 30 A PWM charge controller into a 12 V 7.2 Ah sealed lead-acid battery. Two buck rails step that down: an XL4015 5 V rail for the Pi Zero 2 W, L298N, ACS712 and DHT22, and an LM2596 3.3 V rail for the Pi Pico, DS18B20 and LDRs. Verified figures: Pico dormant 2.64 mW, Pi Zero inference 2250 mW, total average daily draw 217.0 mWh. The Pi Zero is gated by a MOSFET so it draws zero current when idle.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="798" height="342" fill="#FFFFFF"/>
  <!-- source chain -->
  <rect x="30" y="120" width="108" height="64" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="84.0" y="148.0" font-size="11" fill="#1C1917" text-anchor="middle" font-weight="600">20 W PV</text>
  <text x="84.0" y="165.0" font-size="10" fill="#78716C" text-anchor="middle">panel</text>
  <rect x="156" y="120" width="108" height="64" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="210.0" y="148.0" font-size="11" fill="#1C1917" text-anchor="middle" font-weight="600">30 A PWM</text>
  <text x="210.0" y="165.0" font-size="10" fill="#78716C" text-anchor="middle">charge ctrl</text>
  <rect x="282" y="116" width="120" height="72" rx="8" fill="#92400E" stroke="#92400E" stroke-width="1.25"/>
  <text x="342.0" y="145.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">12 V 7.2 Ah</text>
  <text x="342.0" y="162.0" font-size="10" fill="#FDE68A" text-anchor="middle">battery</text>
  <text x="342.0" y="179.0" font-size="9" fill="#FDE68A" text-anchor="middle">86.4 Wh</text>
  <!-- 5V rail -->
  <rect x="430" y="56" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="490.0" y="80.0" font-size="11" fill="#1C1917" text-anchor="middle" font-weight="600">XL4015 5 V</text>
  <text x="490.0" y="97.0" font-size="9" fill="#78716C" text-anchor="middle">buck 5 A</text>
  <rect x="430" y="122" width="120" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="490.0" y="141.0" font-size="11" fill="#92400E" text-anchor="middle" font-weight="600">MOSFET GATE</text>
  <text x="490.0" y="158.0" font-size="9" fill="#92400E" text-anchor="middle">Pi Zero power</text>
  <rect x="430" y="180" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="490.0" y="204.0" font-size="11" fill="#1C1917" text-anchor="middle" font-weight="600">PI ZERO 2 W</text>
  <text x="490.0" y="221.0" font-size="10" fill="#92400E" text-anchor="middle">2250 mW infer</text>
  <rect x="570" y="180" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="620.0" y="200.0" font-size="9" fill="#1C1917" text-anchor="middle">L298N</text>
  <text x="620.0" y="216.0" font-size="9" fill="#78716C" text-anchor="middle">brush H-bridge</text>
  <rect x="678" y="180" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="728.0" y="200.0" font-size="9" fill="#1C1917" text-anchor="middle">ACS712 /</text>
  <text x="728.0" y="216.0" font-size="9" fill="#78716C" text-anchor="middle">DHT22</text>
  <!-- 3.3V rail -->
  <rect x="430" y="252" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="490.0" y="276.0" font-size="11" fill="#1C1917" text-anchor="middle" font-weight="600">LM2596 3.3 V</text>
  <text x="490.0" y="293.0" font-size="9" fill="#78716C" text-anchor="middle">buck 3 A</text>
  <rect x="570" y="252" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="620.0" y="272.0" font-size="9" fill="#1C1917" text-anchor="middle">PI PICO</text>
  <text x="620.0" y="288.0" font-size="10" fill="#92400E" text-anchor="middle">2.64 mW</text>
  <rect x="678" y="252" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.25"/>
  <text x="728.0" y="272.0" font-size="9" fill="#1C1917" text-anchor="middle">DS18B20 /</text>
  <text x="728.0" y="288.0" font-size="9" fill="#78716C" text-anchor="middle">LDR</text>
  <!-- connectors -->
  <path d="M138 152 L156 152" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M264 152 L282 152" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M402 144 Q415 144 415 104 L430 104" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M402 160 Q415 160 415 280 L430 280" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M550 84 L550 122" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M550 166 L550 180" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M550 208 L570 208" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M550 208 L678 208" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M550 280 L570 280" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M550 280 L678 280" fill="none" stroke="#B45309" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="399" y="320" font-size="10" fill="#92400E" text-anchor="middle">Total average daily draw 217.0 mWh from a 20 W panel + 12 V 7.2 Ah battery (~199 days off-grid). Pi Zero gated to zero idle current.</text>
</svg>
