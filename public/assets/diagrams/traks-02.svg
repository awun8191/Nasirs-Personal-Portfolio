<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>TRAKS - Reporting Flow</title>
  <desc>Reporting flow: a user submits an incident with coordinates, reverse geocoding enriches it with address metadata, the report enters the community verification queue, and once verified it is indexed into Cloudflare Vectorize for semantic search.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="840" height="360" fill="#FFFFFF"/>
  <rect x="30" y="130" width="170" height="86" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="115" y="170" font-size="14" fill="#2A1418" text-anchor="middle" font-weight="600">REPORT</text>
  <text x="115" y="190" font-size="11" fill="#991B1B" text-anchor="middle">+ COORDS</text>
  <text x="115" y="240" font-size="9" fill="#991B1B" text-anchor="middle">incident + location</text>
  <rect x="230" y="130" width="170" height="86" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="315" y="170" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">REVERSE</text>
  <text x="315" y="186" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">GEOCODE</text>
  <text x="315" y="204" font-size="10" fill="#991B1B" text-anchor="middle">ADDRESS METADATA</text>
  <text x="315" y="240" font-size="9" fill="#991B1B" text-anchor="middle">enrich with address</text>
  <rect x="430" y="130" width="170" height="86" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="515" y="170" font-size="13" fill="#2A1418" text-anchor="middle" font-weight="600">VERIFY QUEUE</text>
  <text x="515" y="188" font-size="10" fill="#991B1B" text-anchor="middle">COMMUNITY</text>
  <text x="515" y="204" font-size="10" fill="#991B1B" text-anchor="middle">CONFIRM / REFUTE</text>
  <text x="515" y="240" font-size="9" fill="#991B1B" text-anchor="middle">community verifies</text>
  <rect x="630" y="130" width="170" height="86" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.25"/>
  <text x="715" y="170" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">INDEX TO</text>
  <text x="715" y="186" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">VECTORIZE</text>
  <text x="715" y="204" font-size="10" fill="#FECACA" text-anchor="middle">SEMANTIC SEARCH</text>
  <text x="715" y="240" font-size="9" fill="#991B1B" text-anchor="middle">searchable by meaning</text>
  <path d="M200 173 L230 173" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M400 173 L430 173" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <path d="M600 173 L630 173" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#chev)"/>
  <text x="420" y="322" font-size="10" fill="#991B1B" text-anchor="middle">Raw coordinates become an address-enriched report, then a community verification queue, then a Vectorize semantic index.</text>
</svg>
