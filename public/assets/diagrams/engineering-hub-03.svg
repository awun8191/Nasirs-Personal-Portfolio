<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>Engineering Hub - BKT State Machine</title>
  <desc>Bayesian Knowledge Tracing state machine. New cards start at P(L0)=0.15. Incorrect answers keep the card in LEARNING; a correct qualified review moves it to REVIEWING; once P(L) reaches 0.75 it is MASTERED. The massed-practice guard ensures stability only grows when the elapsed gap meets the 0.25 day minimum.</desc>
  <defs><marker id="chev" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="20" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="115.0" y="52.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">NEW</text><text x="115.0" y="67.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">P(L0) = 0.15</text>
<rect x="270" y="20" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="365.0" y="52.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">LEARNING</text><text x="365.0" y="67.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">incorrect / again</text>
<rect x="20" y="300" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="115.0" y="332.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">REVIEWING</text><text x="115.0" y="347.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">qualified review</text>
<rect x="270" y="300" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.25"/><text x="365.0" y="332.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">MASTERED</text><text x="365.0" y="347.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">P(L) >= 0.75</text>
<rect x="110" y="175" width="260" height="120" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.25"/><text x="240.0" y="227.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">nextReviewDue = now</text><text x="240.0" y="242.5" font-size="13" fill="#2A2440" text-anchor="middle" font-weight="500">+ S x 0.25 d</text><text x="240.0" y="258.5" font-size="10" fill="#6D28D9" text-anchor="middle">massed-practice guard: S grows only when elapsed >= 0.25 d</text>
<path d="M210 60.0 L258 60.0 Q 270 60.0 270 60.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M115.0 100 L115.0 288 Q 115.0 300 115.0 300" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M365 100 C365 230 210 230 210 332" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M210 340 C210 230 365 230 365 92" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M210 340.0 L258 340.0 Q 270 340.0 270 340.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<path d="M270 340.0 L222 340.0 Q 210 340.0 210 340.0" fill="none" stroke="#5B21B6" stroke-width="1.25" marker-end="url(#chev)"/>
<text x="240" y="52" font-size="9" fill="#5B21B6" text-anchor="middle" font-weight="600">incorrect</text>
<text x="70" y="212" font-size="9" fill="#5B21B6" text-anchor="middle" font-weight="600">correct</text>
<text x="300" y="212" font-size="9" fill="#5B21B6" text-anchor="middle" font-weight="600">again</text>
  <text x="240" y="468" font-size="11" fill="#6D28D9" text-anchor="middle">BKT state machine: mastery P(L) drives transitions; the massed-practice guard only lets stability grow on qualified (spaced) reviews.</text>
</svg>
