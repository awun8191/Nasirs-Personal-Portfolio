<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-family:'JetBrains Mono',ui-monospace,monospace">
  <title>RAG Data Pipeline - Phase B Retrieval Flow</title>
  <desc>Detailed Phase B retrieval flow across 4 core stages: User Query and Scoping (course metadata filter, domain boundary), Semantic Search (BGE-M3 query vector, Top-K cosine similarity), Context Shaping (passage deduplication, token budget enforcement), and Deterministic Generation (Gemini temperature 0.0, strict JSON schema).</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="#0891B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="360" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="32" font-size="10" font-weight="600" fill="#0891B2" letter-spacing="0.12em">PHASE B / SCOPED RETRIEVAL &amp; SYNTHESIS</text>
  <text x="808" y="32" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">QUERY TO DETERMINISTIC ANSWER</text>
  <line x1="32" y1="44" x2="808" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- STAGE 1: USER QUERY & SCOPE -->
  <rect x="32" y="66" width="170" height="236" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="44" y="78" width="56" height="20" rx="3" fill="#E2E8F0"/>
  <text x="72" y="92" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">STAGE 01</text>
  <text x="44" y="122" font-size="13" font-weight="600" fill="#0F172A">QUERY &amp;</text>
  <text x="44" y="140" font-size="13" font-weight="600" fill="#0F172A">SCOPE FILTER</text>

  <line x1="44" y1="154" x2="190" y2="154" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="174" font-size="9" fill="#0E7490" font-weight="600">INPUT CONSTRAINTS:</text>
  <text x="44" y="192" font-size="8.5" fill="#475569">• Student Assessment Query</text>
  <text x="44" y="208" font-size="8.5" fill="#475569">• Dept / Course Filter</text>
  <text x="44" y="224" font-size="8.5" fill="#475569">• Level 100-500 Scope</text>
  
  <rect x="44" y="244" width="146" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="54" y="261" font-size="8" font-weight="600" fill="#0891B2">DOMAIN BOUNDARY:</text>
  <text x="54" y="275" font-size="8" fill="#64748B">Pre-filtered Partition</text>

  <!-- STAGE 2: SEMANTIC SEARCH -->
  <rect x="237" y="66" width="180" height="236" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="249" y="78" width="56" height="20" rx="3" fill="#E2E8F0"/>
  <text x="277" y="92" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">STAGE 02</text>
  <text x="249" y="122" font-size="13" font-weight="600" fill="#0F172A">VECTOR</text>
  <text x="249" y="140" font-size="13" font-weight="600" fill="#0F172A">TOP-K SEARCH</text>

  <line x1="249" y1="154" x2="405" y2="154" stroke="#E2E8F0" stroke-width="1"/>
  <text x="249" y="174" font-size="9" fill="#0E7490" font-weight="600">RETRIEVAL PARAMS:</text>
  <text x="249" y="192" font-size="8.5" fill="#475569">• BGE-M3 Query Embedding</text>
  <text x="249" y="208" font-size="8.5" fill="#475569">• Cosine Similarity Metric</text>
  <text x="249" y="224" font-size="8.5" fill="#475569">• Top-K Candidate Chunks</text>
  
  <rect x="249" y="244" width="156" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="259" y="261" font-size="8" font-weight="600" fill="#0891B2">INDEX ISOLATION:</text>
  <text x="259" y="275" font-size="8" fill="#64748B">Zero Cross-Domain Bleed</text>

  <!-- STAGE 3: CONTEXT SHAPING -->
  <rect x="452" y="66" width="180" height="236" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <rect x="464" y="78" width="56" height="20" rx="3" fill="#E2E8F0"/>
  <text x="492" y="92" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">STAGE 03</text>
  <text x="464" y="122" font-size="13" font-weight="600" fill="#0F172A">CONTEXT</text>
  <text x="464" y="140" font-size="13" font-weight="600" fill="#0F172A">SHAPING</text>

  <line x1="464" y1="154" x2="620" y2="154" stroke="#E2E8F0" stroke-width="1"/>
  <text x="464" y="174" font-size="9" fill="#0E7490" font-weight="600">BUDGET ENFORCEMENT:</text>
  <text x="464" y="192" font-size="8.5" fill="#475569">• Chunk Hash Deduplication</text>
  <text x="464" y="208" font-size="8.5" fill="#475569">• Token Ceiling Trimming</text>
  <text x="464" y="224" font-size="8.5" fill="#475569">• Metadata-Weighted Order</text>
  
  <rect x="464" y="244" width="156" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="474" y="261" font-size="8" font-weight="600" fill="#0891B2">ASSEMBLED PROMPT:</text>
  <text x="474" y="275" font-size="8" fill="#64748B">Clean Verified Context</text>

  <!-- STAGE 4: DETERMINISTIC SYNTHESIS -->
  <rect x="667" y="66" width="141" height="236" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
  <rect x="679" y="78" width="56" height="20" rx="3" fill="#0891B2"/>
  <text x="707" y="92" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">STAGE 04</text>
  <text x="679" y="122" font-size="13" font-weight="600" fill="#0E7490">JSON-SCHEMA</text>
  <text x="679" y="140" font-size="13" font-weight="600" fill="#0E7490">SYNTHESIS</text>

  <line x1="679" y1="154" x2="796" y2="154" stroke="#A5F3FC" stroke-width="1"/>
  <text x="679" y="174" font-size="9" fill="#0E7490" font-weight="600">REPRODUCIBILITY:</text>
  <text x="679" y="192" font-size="8.5" fill="#155E75">• Temperature 0.0</text>
  <text x="679" y="208" font-size="8.5" fill="#155E75">• Schema Validation</text>
  <text x="679" y="224" font-size="8.5" fill="#155E75">• Exact Citation Keys</text>
  
  <rect x="679" y="244" width="117" height="42" rx="4" fill="#0E7490" stroke="#0891B2" stroke-width="1"/>
  <text x="689" y="261" font-size="8" font-weight="600" fill="#A5F3FC">FINAL PAYLOAD:</text>
  <text x="689" y="275" font-size="8" fill="#FFFFFF">Verified Answer</text>

  <!-- Connectors -->
  <path d="M202 184 L237 184" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M417 184 L452 184" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M632 184 L667 184" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Footer -->
  <line x1="32" y1="326" x2="808" y2="326" stroke="#E2E8F0" stroke-width="1"/>
  <text x="32" y="342" font-size="8.5" fill="#64748B">CourseGen / Phase B Scoped Retrieval</text>
  <text x="808" y="342" font-size="8.5" fill="#64748B" text-anchor="end">Source: github.com/awun8191/CourseGen</text>
</svg>
